name: Cargar override final del panel
on:
  push:
    paths:
      - '.github/workflows/load-panel-overrides-after.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargar override después del CSS principal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css=Path('cluster-image.css')
          s='\n'.join(line for line in css.read_text().splitlines() if 'panel-size-overrides.css' not in line)+'\n'
          css.write_text(s)
          p=Path('index.html')
          h=p.read_text()
          h=h.replace('cluster-image.css?v=video-project-3-1-19','cluster-image.css?v=video-project-3-1-20')
          h=h.replace('<link rel="stylesheet" href="cluster-image.css?v=video-project-3-1-20">','<link rel="stylesheet" href="cluster-image.css?v=video-project-3-1-20">\n<link rel="stylesheet" href="panel-size-overrides.css?v=20">')
          p.write_text(h)
          PY
      - name: Validar
        run: |
          grep -q 'cluster-image.css?v=video-project-3-1-20' index.html
          grep -q 'panel-size-overrides.css?v=20' index.html
          ! head -n 3 cluster-image.css | grep -q 'panel-size-overrides.css'
      - name: Publicar y retirar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/load-panel-overrides-after.yml
          git add cluster-image.css index.html .github/workflows/load-panel-overrides-after.yml
          git commit -m 'Carga override del panel después del CSS principal'
          git push
