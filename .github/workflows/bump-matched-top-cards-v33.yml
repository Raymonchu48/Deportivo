name: Bump matched top cards v33
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-matched-top-cards-v33.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump cache version
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/mobile-cluster-fix.css?v=32/mobile-cluster-fix.css?v=33/g' index.html
          grep -q 'mobile-cluster-fix.css?v=33' index.html
      - name: Commit and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Iguala las tarjetas superiores con los módulos inferiores'
          git rm .github/workflows/bump-matched-top-cards-v33.yml
          git commit --amend --no-edit
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
