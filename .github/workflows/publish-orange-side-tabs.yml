name: Publicar acento naranja lateral

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar caché del override
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('panel-size-overrides.css?v=22', 'panel-size-overrides.css?v=23')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validar
        shell: bash
        run: |
          grep -q 'panel-size-overrides.css?v=23' index.html
          grep -q 'RIGHT-ACTIONS-ORANGE-ACCENT-START' panel-size-overrides.css
      - name: Publicar y retirar workflow temporal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/publish-orange-side-tabs.yml
          git add index.html panel-size-overrides.css .github/workflows/publish-orange-side-tabs.yml
          git commit -m 'Unifica pestañas laterales con naranja flúor'
          git push
