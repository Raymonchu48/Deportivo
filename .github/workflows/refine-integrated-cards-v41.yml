name: Final integrated module cards v41
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-integrated-cards-v41.yml'
permissions:
  contents: write
jobs:
  build:
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin fonts-dejavu-core
      - name: Crear diseño integrado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-v41
          python3 - <<'PY'
          from pathlib import Path
          O='#ff9418'; O2='#ffd08a'; W='#f7ffff'; C='#9eefff'; P='#041722'; P2='#06232f'
          cards=[('01','Entrenamiento','Planificación de cargas','training'),('02','Nutrición','Balance nutricional','nutrition'),('03','Psicología','Foco y adherencia','mind'),('04','Recuperación','Descanso y movilidad','recovery'),('05','Gestión','Planificación y control','management')]
          icons={
          'training':"<path d='M4 18h16M6 18V9m12 9V9M8 9h8M9 6h6M10 3h4' fill='none' stroke='{c}' stroke-width='1.8' stroke-linecap='round'/><circle cx='12' cy='12' r='5.5' fill='none' stroke='{c}' stroke-width='1.5'/><path d='M12 8v4l2.5 1.8' fill='none' stroke='{c}' stroke-width='1.7' stroke-linecap='round'/>",
          'nutrition':"<path d='M12 7c-2.8-3.1-7-1.2-7 3.1C5 15.7 8.5 20 12 20s7-4.3 7-9.9C19 5.8 14.8 3.9 12 7Z' fill='none' stroke='{c}' stroke-width='1.7'/><path d='M12 7c.2-2.7 1.6-4.1 4-4M18.5 5v14M16 5v6m5-6v6' fill='none' stroke='{c}' stroke-width='1.6' stroke-linecap='round'/>",
          'mind':"<path d='M9.5 4.2a3.4 3.4 0 0 0-4.3 3.2c0 .6.1 1.1.4 1.6A3.8 3.8 0 0 0 7 16.3V20h5V5a3.5 3.5 0 0 0-2.5-.8ZM14.5 4.2a3.4 3.4 0 0 1 4.3 3.2c0 .6-.1 1.1-.4 1.6a3.8 3.8 0 0 1-1.4 7.3V20h-5V5a3.5 3.5 0 0 1 2.5-.8Z' fill='none' stroke='{c}' stroke-width='1.5'/><path d='M7.5 9h2M14.5 8h2M8 13h2M14 13h2' stroke='{c}' stroke-width='1.5' stroke-linecap='round'/>",
          'recovery':"<path d='M20.8 8.4c0 5.4-8.8 11-8.8 11S3.2 13.8 3.2 8.4A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.2Z' fill='none' stroke='{c}' stroke-width='1.7'/><path d='M6.5 11h3l1.1-2.4 2.1 5 1.3-2.6h3.5' fill='none' stroke='{c}' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/>",
          'management':"<rect x='4' y='5' width='16' height='15' rx='2' fill='none' stroke='{c}' stroke-width='1.6'/><path d='M8 3v4M16 3v4M4 9h16M8 13h2M12 13h2M16 13h1M8 16h2M12 16h5' stroke='{c}' stroke-width='1.5' stroke-linecap='round'/>"
          }
          def ico(k,x,y,s): return f"<g transform='translate({x} {y}) scale({s/24})'>"+icons[k].format(c=O)+"</g>"
          def wide(w,h):
              veil=int(h*.69); y=int(h*.73); ch=h-y-7; m=22; g=8; cw=(w-2*m-4*g)/5
              z=[f"<svg xmlns='http://www.w3.org/2000/svg' width='{w}' height='{h}'><defs><linearGradient id='v' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#021019' stop-opacity='0'/><stop offset='.17' stop-color='#021019' stop-opacity='.90'/><stop offset='1' stop-color='#020d14' stop-opacity='.98'/></linearGradient><linearGradient id='c' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='{P2}' stop-opacity='.91'/><stop offset='1' stop-color='{P}' stop-opacity='.97'/></linearGradient></defs><rect x='0' y='{veil}' width='{w}' height='{h-veil}' fill='url(#v)'/><text x='{w/2}' y='{y-8}' text-anchor='middle' fill='{O}' font-family='DejaVu Sans Mono' font-weight='700' font-size='7' letter-spacing='2.2'>EXPLORA LOS MÓDULOS</text>"]
              for i,(n,t,d,k) in enumerate(cards):
                  x=m+i*(cw+g)
                  z += [f"<rect x='{x:.1f}' y='{y}' width='{cw:.1f}' height='{ch}' rx='8' fill='url(#c)' stroke='{O}' stroke-opacity='.72' stroke-width='1.1'/>",ico(k,x+11,y+11,52),f"<text x='{x+72:.1f}' y='{y+22}' fill='{O}' font-family='DejaVu Sans Mono' font-weight='700' font-size='7.5'>{n}</text>",f"<text x='{x+72:.1f}' y='{y+43}' fill='{W}' font-family='DejaVu Sans' font-weight='700' font-size='10'>{t}</text>",f"<text x='{x+12:.1f}' y='{y+84}' fill='{C}' font-family='DejaVu Sans' font-size='8.5'>{d}</text>",f"<line x1='{x+10:.1f}' y1='{y+ch-5}' x2='{x+cw-10:.1f}' y2='{y+ch-5}' stroke='{O2}' stroke-opacity='.92' stroke-width='1.2'/>"]
              z.append('</svg>'); return ''.join(z)
          def mobile(w,h):
              veil=int(h*.685); ty=int(h*.755); by=int(h*.875); ch=int(h*.105); m=int(w*.035); g=int(w*.014); cw=(w-2*m-2*g)/3
              pos=[(m+i*(cw+g),ty,cw) for i in range(3)]; s=(w-(2*cw+g))/2; pos += [(s,by,cw),(s+cw+g,by,cw)]
              z=[f"<svg xmlns='http://www.w3.org/2000/svg' width='{w}' height='{h}'><defs><linearGradient id='v' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#021019' stop-opacity='0'/><stop offset='.14' stop-color='#021019' stop-opacity='.91'/><stop offset='1' stop-color='#020d14' stop-opacity='.99'/></linearGradient><linearGradient id='c' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='{P2}' stop-opacity='.93'/><stop offset='1' stop-color='{P}' stop-opacity='.98'/></linearGradient></defs><rect x='0' y='{veil}' width='{w}' height='{h-veil}' fill='url(#v)'/><text x='{w/2}' y='{ty-22}' text-anchor='middle' fill='{O}' font-family='DejaVu Sans Mono' font-weight='700' font-size='14' letter-spacing='3'>EXPLORA LOS MÓDULOS</text>"]
              for (n,t,d,k),(x,y,cw0) in zip(cards,pos):
                  z += [f"<rect x='{x:.1f}' y='{y}' width='{cw0:.1f}' height='{ch}' rx='10' fill='url(#c)' stroke='{O}' stroke-opacity='.74' stroke-width='2'/>",ico(k,x+14,y+14,58),f"<text x='{x+84:.1f}' y='{y+30}' fill='{O}' font-family='DejaVu Sans Mono' font-weight='700' font-size='14'>{n}</text>",f"<text x='{x+84:.1f}' y='{y+62}' fill='{W}' font-family='DejaVu Sans' font-weight='700' font-size='18'>{t}</text>",f"<text x='{x+16:.1f}' y='{y+ch-28}' fill='{C}' font-family='DejaVu Sans' font-size='13'>{d}</text>",f"<line x1='{x+14:.1f}' y1='{y+ch-8}' x2='{x+cw0-14:.1f}' y2='{y+ch-8}' stroke='{O2}' stroke-opacity='.92' stroke-width='2'/>"]
              z.append('</svg>'); return ''.join(z)
          for name,w,h,fn in [('wide',910,512,wide),('mobile',900,1600,mobile),('phone',900,1948,mobile)]: Path(f'.tmp-v41/{name}.svg').write_text(fn(w,h),encoding='utf-8')
          PY
          rsvg-convert .tmp-v41/wide.svg -o .tmp-v41/wide.png
          rsvg-convert .tmp-v41/mobile.svg -o .tmp-v41/mobile.png
          rsvg-convert .tmp-v41/phone.svg -o .tmp-v41/phone.png
      - name: Renderizar vídeo y posters
        shell: bash
        run: |
          set -euo pipefail
          render(){ src="$1"; png="$2"; out="$3"; crf="$4"; d=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$src"); ffmpeg -y -i "$src" -loop 1 -framerate 30 -i "$png" -filter_complex "[0:v][1:v]overlay=0:0:format=auto:shortest=1" -c:v libx264 -preset veryfast -crf "$crf" -pix_fmt yuv420p -an -t "$d" "$out"; }
          render cluster-video-project-3-1-fluid-coach.mp4 .tmp-v41/wide.png cluster-video-project-3-1-fluid-coach-cards-v41.mp4 16
          render cluster-video-project-3-1-fluid-coach-mobile.mp4 .tmp-v41/mobile.png cluster-video-project-3-1-fluid-coach-mobile-cards-v41.mp4 17
          render cluster-video-project-3-1-fluid-coach-phone-v31.mp4 .tmp-v41/phone.png cluster-video-project-3-1-fluid-coach-phone-cards-v41.mp4 17
          ffmpeg -y -ss 0.8 -i cluster-video-project-3-1-fluid-coach-cards-v41.mp4 -frames:v 1 cluster-video-project-3-1-fluid-coach-cards-v41-poster-wide.webp
          ffmpeg -y -ss 0.8 -i cluster-video-project-3-1-fluid-coach-mobile-cards-v41.mp4 -frames:v 1 cluster-video-project-3-1-fluid-coach-mobile-cards-v41-poster.webp
          ffmpeg -y -ss 0.8 -i cluster-video-project-3-1-fluid-coach-phone-cards-v41.mp4 -frames:v 1 cluster-video-project-3-1-fluid-coach-phone-cards-v41-poster.webp
      - name: Activar v41
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'cluster-video-project-3-1-fluid-coach(?:-cards-v\d+)?-poster-wide\.webp','cluster-video-project-3-1-fluid-coach-cards-v41-poster-wide.webp',s)
          s=re.sub(r'cluster-video-project-3-1-fluid-coach-mobile(?:-cards-v\d+)?-poster\.webp','cluster-video-project-3-1-fluid-coach-mobile-cards-v41-poster.webp',s)
          s=re.sub(r'cluster-video-project-3-1-fluid-coach-phone(?:-cards-v\d+)?-poster\.webp','cluster-video-project-3-1-fluid-coach-phone-cards-v41-poster.webp',s)
          s=re.sub(r'cluster-video-project-3-1-fluid-coach-cards-v\d+\.mp4\?v=[^\" ]+','cluster-video-project-3-1-fluid-coach-cards-v41.mp4?v=integrated-cards-41',s)
          s=re.sub(r'cluster-video-project-3-1-fluid-coach-mobile-cards-v\d+\.mp4\?v=[^\" ]+','cluster-video-project-3-1-fluid-coach-mobile-cards-v41.mp4?v=integrated-cards-41',s)
          s=re.sub(r'cluster-video-project-3-1-fluid-coach-phone-cards-v\d+\.mp4\?v=[^\" ]+','cluster-video-project-3-1-fluid-coach-phone-cards-v41.mp4?v=integrated-cards-41',s)
          link='<link rel="stylesheet" href="module-cards-reference-v41.css?v=41">'
          if link not in s: s=s.replace('<link rel="stylesheet" href="module-cards-integrated-v38.css?v=38">','<link rel="stylesheet" href="module-cards-integrated-v38.css?v=38">\n'+link)
          p.write_text(s,encoding='utf-8')
          PY
          cat > module-cards-reference-v41.css <<'CSS'
          @media (min-width:901px) and (orientation:landscape){
            .ic-modules{left:2.4%!important;right:2.4%!important;bottom:1.35%!important;height:26%!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:.88%!important}
            .ic-modules button{border-radius:8px!important}
            .ic-modules button:hover,.ic-modules button:focus-visible,.ic-modules button.is-active,.ic-modules button[aria-expanded=true]{border-color:rgba(255,190,115,.70)!important;background:rgba(255,122,0,.028)!important;box-shadow:inset 0 0 20px rgba(255,122,0,.06),0 0 10px rgba(255,122,0,.08)!important;transform:translateY(-1px)!important}
          }
          @media (max-width:900px) and (orientation:portrait){
            .ic-modules{left:3.5%!important;right:3.5%!important;bottom:1.7%!important;height:24.5%!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important;gap:6px 7px!important}
            .ic-modules button{border-radius:10px!important}
          }
          CSS
      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          test -s cluster-video-project-3-1-fluid-coach-cards-v41.mp4
          test -s cluster-video-project-3-1-fluid-coach-mobile-cards-v41.mp4
          test -s cluster-video-project-3-1-fluid-coach-phone-cards-v41.mp4
          grep -q 'integrated-cards-41' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html module-cards-reference-v41.css cluster-video-project-3-1-fluid-coach-cards-v41.mp4 cluster-video-project-3-1-fluid-coach-mobile-cards-v41.mp4 cluster-video-project-3-1-fluid-coach-phone-cards-v41.mp4 cluster-video-project-3-1-fluid-coach-cards-v41-poster-wide.webp cluster-video-project-3-1-fluid-coach-mobile-cards-v41-poster.webp cluster-video-project-3-1-fluid-coach-phone-cards-v41-poster.webp
          git rm .github/workflows/refine-integrated-cards-v41.yml
          git rm -f .github/workflows/refine-integrated-cards-v40.yml .github/workflows/refine-integrated-cards-v39.yml || true
          git commit -m 'Integra módulos inferiores con el diseño visual de referencia'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
