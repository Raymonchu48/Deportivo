name: Activate corrected profile video
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-corrected-profile-video.yml'
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject corrected video source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='  <script src="profile-video-source.js?v=1"></script>\n'
          if 'profile-video-source.js' not in s:
              s=s.replace('</body>', tag + '</body>')
              p.write_text(s,encoding='utf-8')
          PY
          grep -q 'profile-video-source.js?v=1' index.html
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/activate-corrected-profile-video.yml
          git commit -m 'Publica el vídeo corregido del perfil profesional'
          git push origin HEAD:main
