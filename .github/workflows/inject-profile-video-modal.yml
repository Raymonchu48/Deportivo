name: Enable profile video modal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-profile-video-modal.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject profile video script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='  <script src="profile-video-modal.js?v=2"></script>\n'
          if 'profile-video-modal.js' not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
          grep -q 'profile-video-modal.js?v=2' index.html
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Activa vídeo interactivo del perfil profesional'
          git rm .github/workflows/inject-profile-video-modal.yml
          git commit --amend --no-edit
          git push origin HEAD:main
