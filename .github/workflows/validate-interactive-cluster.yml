name: Validate interactive cluster

on:
  pull_request:
    branches: [main]
    paths:
      - 'cluster-motion/**'
      - '.github/workflows/validate-interactive-cluster.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Locate final part-01 mismatch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('cluster-motion/part-01.txt'); s=p.read_text()
          missing='gAACAAAAAABAAAUAAAAAAEAAAgAAAAAAQAAAAAAAAABAAAEAAAAAAEAABQAAAAAAQAACAAAAAABAAAAAAAAAAEAAAQAAAAAA'
          if len(s)==13904: s=s[:1149]+missing+s[1149:]
          print('LEN',len(s))
          for i in range(0,len(s),500):
              print(i,hashlib.sha256(s[i:i+500].encode()).hexdigest()[:16])
          PY
          exit 1
