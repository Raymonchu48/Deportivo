name: Validate interactive cluster

on:
  pull_request:
    branches: [main]
    paths:
      - 'cluster-motion/**'
      - 'sport-approved-hero.js'
      - 'sport-approved-hero.css'
      - 'index.html'
      - '.github/workflows/validate-interactive-cluster.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose altered windows
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          windows={'01':(900,1300),'02':(10900,11600),'08':(3400,4100)}
          for part,(a,b) in windows.items():
              s=pathlib.Path(f'cluster-motion/part-{part}.txt').read_text()
              print(f'===PART {part} LEN {len(s)} RANGE {a}:{b}===')
              print(s[a:b])
              print(f'===END {part}===')
          PY
      - name: Stop after diagnosis
        run: exit 1
