name: Validate interactive cluster

on:
  pull_request:
    branches: [main]
    paths:
      - 'cluster-motion/**'
      - 'sport-approved-hero.js'
      - 'sport-approved-hero.css'
      - 'index.html'
      - '.github/workflows/validate-interactive-cluster.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Test fragment repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cluster-motion/part-01.txt'); s=p.read_text(); missing='gAACAAAAAABAAAUAAAAAAEAAAgAAAAAAQAAAAAAAAABAAAEAAAAAAEAABQAAAAAAQAACAAAAAABAAAAAAAAAAEAAAQAAAAAA'
          if len(s)==13904: p.write_text(s[:1149]+missing+s[1149:])
          p=Path('cluster-motion/part-02.txt'); s=p.read_text()
          if len(s)==14000 and s[11038]=='t': p.write_text(s[:11038]+'T'+s[11039:])
          p=Path('cluster-motion/part-08.txt'); s=p.read_text()
          if len(s)==14000 and s[3925]=='g': p.write_text(s[:3925]+'G'+s[3926:])
          PY
          echo "01 $(wc -c < cluster-motion/part-01.txt) $(git hash-object cluster-motion/part-01.txt)"
          echo "02 $(wc -c < cluster-motion/part-02.txt) $(git hash-object cluster-motion/part-02.txt)"
          echo "08 $(wc -c < cluster-motion/part-08.txt) $(git hash-object cluster-motion/part-08.txt)"
          exit 1
