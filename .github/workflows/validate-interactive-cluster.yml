name: Validate interactive cluster

on:
  pull_request:
    branches: [main]
    paths:
      - 'cluster-motion/**'
      - 'sport-approved-hero.js'
      - 'sport-approved-hero.css'
      - 'index.html'
      - '.github/workflows/validate-interactive-cluster.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Repair fragment transport errors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('cluster-motion/part-01.txt')
          s=p.read_text()
          missing='gAACAAAAAABAAAUAAAAAAEAAAgAAAAAAQAAAAAAAAABAAAEAAAAAAEAABQAAAAAAQAACAAAAAABAAAAAAAAAAEAAAQAAAAAA'
          if len(s)==13904:
              s=s[:1149]+missing+s[1149:]
          if len(s)==14000 and s[3357]=='i':
              s=s[:3357]+'C'+s[3358:]
          p.write_text(s)

          p=Path('cluster-motion/part-02.txt')
          s=p.read_text()
          if len(s)==14000 and s[11038]=='t':
              s=s[:11038]+'T'+s[11039:]
          p.write_text(s)

          p=Path('cluster-motion/part-08.txt')
          s=p.read_text()
          if len(s)==14000 and s[3925]=='g':
              s=s[:3925]+'G'+s[3926:]
          p.write_text(s)
          PY
          test "$(git hash-object cluster-motion/part-01.txt)" = "14370b69cff4a6d85e52edf1d0ea47a5043b6cd6"
          test "$(git hash-object cluster-motion/part-02.txt)" = "cf102cdc91c807b4dd41911b2833cc8858c15f38"
          test "$(git hash-object cluster-motion/part-08.txt)" = "adb46d7bd4dd7cb5a1d7be89eccfdc71c4e665a4"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cluster-motion/part-01.txt cluster-motion/part-02.txt cluster-motion/part-08.txt
          if ! git diff --cached --quiet; then
            git commit -m "Corrige fragmentos del vídeo interactivo"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Verify all fragment hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object cluster-motion/part-01.txt)" = "14370b69cff4a6d85e52edf1d0ea47a5043b6cd6"
          test "$(git hash-object cluster-motion/part-02.txt)" = "cf102cdc91c807b4dd41911b2833cc8858c15f38"
          test "$(git hash-object cluster-motion/part-03.txt)" = "1366126e7901d10e2657512e368df7952999a1f6"
          test "$(git hash-object cluster-motion/part-04.txt)" = "7abad9ec6736ece0729532f6c9d89ec476691105"
          test "$(git hash-object cluster-motion/part-05.txt)" = "28df987531aa58806f6bd5991e9264ab9a6c3be5"
          test "$(git hash-object cluster-motion/part-06.txt)" = "d6c229ce4d3dfafd7ad6b42adf1f06ed2813f065"
          test "$(git hash-object cluster-motion/part-07.txt)" = "467bb66e831717887fd47aeaef872235abca70be"
          test "$(git hash-object cluster-motion/part-08.txt)" = "adb46d7bd4dd7cb5a1d7be89eccfdc71c4e665a4"
          test "$(git hash-object cluster-motion/part-09.txt)" = "2d6fcec4f976df4b83439d6996ab71b584b42e17"
      - name: Reconstruct cluster video
        shell: bash
        run: |
          set -euo pipefail
          cat cluster-motion/part-*.txt | tr -d '\r\n\t ' | base64 --decode > /tmp/cluster-motion.mp4
          test "$(stat -c%s /tmp/cluster-motion.mp4)" = "90020"
          test "$(sha256sum /tmp/cluster-motion.mp4 | cut -d' ' -f1)" = "d7dbf4c9e26fe9ff7cac8a049c862a1f47ab50ac983e36a09dbbc67dc92897f1"
      - name: Validate video stream
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate -show_entries format=duration -of default=noprint_wrappers=1 /tmp/cluster-motion.mp4
          ffmpeg -v error -i /tmp/cluster-motion.mp4 -f null -
      - name: Validate JavaScript
        run: node --check sport-approved-hero.js
