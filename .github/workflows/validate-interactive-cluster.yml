name: Validate interactive cluster

on:
  pull_request:
    branches: [main]
    paths:
      - 'cluster-motion/**'
      - '.github/workflows/validate-interactive-cluster.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Show final part-01 window
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('cluster-motion/part-01.txt').read_text()
          missing='gAACAAAAAABAAAUAAAAAAEAAAgAAAAAAQAAAAAAAAABAAAEAAAAAAEAABQAAAAAAQAACAAAAAABAAAAAAAAAAEAAAQAAAAAA'
          if len(s)==13904: s=s[:1149]+missing+s[1149:]
          print(s[2900:3600])
          PY
          exit 1
