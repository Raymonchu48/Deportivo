name: Activate top action dropdowns v43
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-top-actions-dropdown-v43.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activar estilos e interacción v43
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="top-actions-dropdown-v43.css?v=43">'
          js='<script src="top-actions-dropdown-v43.js?v=43" defer></script>'
          if css not in s:
              anchor='<link rel="stylesheet" href="module-cards-reference-v42.css?v=42">'
              if anchor not in s:
                  raise SystemExit('No se encontró el ancla CSS v42')
              s=s.replace(anchor,anchor+'\n'+css,1)
          if js not in s:
              anchor='<script src="cluster-image.js?v=video-project-3-1-27" defer></script>'
              if anchor not in s:
                  raise SystemExit('No se encontró el script del clúster')
              s=s.replace(anchor,anchor+'\n'+js,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar activación
        shell: bash
        run: |
          grep -q 'top-actions-dropdown-v43.css?v=43' index.html
          grep -q 'top-actions-dropdown-v43.js?v=43' index.html
          test -f top-actions-dropdown-v43.css
          test -f top-actions-dropdown-v43.js
      - name: Publicar y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/activate-top-actions-dropdown-v43.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/activate-top-actions-dropdown-v43.yml
          git commit -m 'Activa paneles contextuales en las tarjetas superiores'
          git push origin HEAD:main
