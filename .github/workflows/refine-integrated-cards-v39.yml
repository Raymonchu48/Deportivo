name: Refine integrated module cards v39
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-integrated-cards-v39.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin fonts-dejavu-core

      - name: Generar overlays integrados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-v39
          python3 - <<'PY'
          from pathlib import Path

          ORANGE='#ff9418'; ORANGE2='#ffd08a'; WHITE='#f7ffff'; CYAN='#9eefff'
          PANEL='#041722'; PANEL2='#06232f'

          cards=[
            ('01','Entrenamiento','Planificación de cargas','training'),
            ('02','Nutrición','Balance nutricional','nutrition'),
            ('03','Psicología','Foco y adherencia','mind'),
            ('04','Recuperación','Descanso y movilidad','recovery'),
            ('05','Gestión','Planificación y control','management'),
          ]

          icons={
          'training':"<path d='M4 18h16M6 18V9m12 9V9M8 9h8M9 6h6M10 3h4' fill='none' stroke='{c}' stroke-width='1.8' stroke-linecap='round'/><circle cx='12' cy='12' r='5.5' fill='none' stroke='{c}' stroke-width='1.5'/><path d='M12 8v4l2.5 1.8' fill='none' stroke='{c}' stroke-width='1.7' stroke-linecap='round'/>" ,
          'nutrition':"<path d='M12 7c-2.8-3.1-7-1.2-7 3.1C5 15.7 8.5 20 12 20s7-4.3 7-9.9C19 5.8 14.8 3.9 12 7Z' fill='none' stroke='{c}' stroke-width='1.7'/><path d='M12 7c.2-2.7 1.6-4.1 4-4M18.5 5v14M16 5v6m5-6v6' fill='none' stroke='{c}' stroke-width='1.6' stroke-linecap='round'/>" ,
          'mind':"<path d='M9.5 4.2a3.4 3.4 0 0 0-4.3 3.2c0 .6.1 1.1.4 1.6A3.8 3.8 0 0 0 7 16.3V20h5V5a3.5 3.5 0 0 0-2.5-.8ZM14.5 4.2a3.4 3.4 0 0 1 4.3 3.2c0 .6-.1 1.1-.4 1.6a3.8 3.8 0 0 1-1.4 7.3V20h-5V5a3.5 3.5 0 0 1 2.5-.8Z' fill='none' stroke='{c}' stroke-width='1.5'/><path d='M7.5 9h2M14.5 8h2M8 13h2M14 13h2' stroke='{c}' stroke-width='1.5' stroke-linecap='round'/><path d='M18 3h3v3' fill='none' stroke='{c}' stroke-width='1.4'/>" ,
          'recovery':"<path d='M20.8 8.4c0 5.4-8.8 11-8.8 11S3.2 13.8 3.2 8.4A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.2Z' fill='none' stroke='{c}' stroke-width='1.7'/><path d='M6.5 11h3l1.1-2.4 2.1 5 1.3-2.6h3.5' fill='none' stroke='{c}' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/>" ,
          'management':"<rect x='4' y='5' width='16' height='15' rx='2' fill='none' stroke='{c}' stroke-width='1.6'/><path d='M8 3v4M16 3v4M4 9h16M8 13h2M12 13h2M16 13h1M8 16h2M12 16h5' stroke='{c}' stroke-width='1.5' stroke-linecap='round'/><circle cx='18' cy='18' r='3.5' fill='{p}' stroke='{c}' stroke-width='1.3'/><path d='M18 16.5v3M16.5 18h3' stroke='{c}' stroke-width='1.2'/>"
          }

          def icon(kind,x,y,size):
              return f"<g transform='translate({x} {y}) scale({size/24})'>"+icons[kind].format(c=ORANGE,p=PANEL)+"</g>"

          def svg_wide(w,h):
              strip_y=int(h*.705); card_y=int(h*.735); card_h=h-card_y-8
              margin=24; gap=8; card_w=(w-2*margin-4*gap)/5
              out=[f"""<svg xmlns='http://www.w3.org/2000/svg' width='{w}' height='{h}' viewBox='0 0 {w} {h}'>
              <defs>
                <linearGradient id='veil' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#021019' stop-opacity='0'/><stop offset='.18' stop-color='#021019' stop-opacity='.82'/><stop offset='1' stop-color='#020d14' stop-opacity='.97'/></linearGradient>
                <linearGradient id='card' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='{PANEL2}' stop-opacity='.90'/><stop offset='1' stop-color='{PANEL}' stop-opacity='.94'/></linearGradient>
                <filter id='glow'><feGaussianBlur stdDeviation='1.5' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
              </defs>
              <rect x='0' y='{strip_y}' width='{w}' height='{h-strip_y}' fill='url(#veil)'/>
              <text x='{w/2}' y='{card_y-9}' text-anchor='middle' fill='{ORANGE}' font-family='DejaVu Sans Mono' font-weight='700' font-size='7' letter-spacing='2.2'>EXPLORA LOS MÓDULOS</text>"""]
              for i,(num,title,desc,kind) in enumerate(cards):
                  x=margin+i*(card_w+gap)
                  out.append(f"<rect x='{x:.1f}' y='{card_y}' width='{card_w:.1f}' height='{card_h}' rx='7' fill='url(#card)' stroke='{ORANGE}' stroke-opacity='.70' stroke-width='1.15'/>")
                  out.append(f"<line x1='{x+9:.1f}' y1='{card_y+card_h-4}' x2='{x+card_w-9:.1f}' y2='{card_y+card_h-4}' stroke='{ORANGE2}' stroke-opacity='.92' stroke-width='1.1' filter='url(#glow)'/>")
                  out.append(icon(kind,x+12,card_y+12,46))
                  out.append(f"<text x='{x+68:.1f}' y='{card_y+22}' fill='{ORANGE}' font-family='DejaVu Sans Mono' font-weight='700' font-size='7'>{num}</text>")
                  out.append(f"<text x='{x+68:.1f}' y='{card_y+42}' fill='{WHITE}' font-family='DejaVu Sans' font-weight='700' font-size='10'>{title}</text>")
                  out.append(f"<text x='{x+12:.1f}' y='{card_y+82}' fill='{CYAN}' fill-opacity='.90' font-family='DejaVu Sans' font-size='8.4'>{desc}</text>")
                  out.append(f"<path d='M {x+12:.1f} {card_y+94} H {x+card_w-12:.1f}' stroke='{ORANGE}' stroke-opacity='.36' stroke-width='.8'/>")
              out.append('</svg>'); return ''.join(out)

          def svg_mobile(w,h):
              strip_y=int(h*.69); label_y=int(h*.735)
              margin=int(w*.035); gap=int(w*.014); card_h=int(h*.11)
              top_y=int(h*.75); bot_y=int(h*.875)
              cw=(w-2*margin-2*gap)/3
              positions=[(margin+i*(cw+gap),top_y,cw) for i in range(3)]
              start=(w-(2*cw+gap))/2
              positions += [(start,bot_y,cw),(start+cw+gap,bot_y,cw)]
              out=[f"""<svg xmlns='http://www.w3.org/2000/svg' width='{w}' height='{h}' viewBox='0 0 {w} {h}'>
              <defs>
                <linearGradient id='veil' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#021019' stop-opacity='0'/><stop offset='.14' stop-color='#021019' stop-opacity='.84'/><stop offset='1' stop-color='#020d14' stop-opacity='.98'/></linearGradient>
                <linearGradient id='card' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='{PANEL2}' stop-opacity='.92'/><stop offset='1' stop-color='{PANEL}' stop-opacity='.96'/></linearGradient>
              </defs>
              <rect x='0' y='{strip_y}' width='{w}' height='{h-strip_y}' fill='url(#veil)'/>
              <text x='{w/2}' y='{label_y}' text-anchor='middle' fill='{ORANGE}' font-family='DejaVu Sans Mono' font-weight='700' font-size='{max(12,int(w*.016))}' letter-spacing='3'>EXPLORA LOS MÓDULOS</text>"""]
              for (num,title,desc,kind),(x,y,cw0) in zip(cards,positions):
                  out.append(f"<rect x='{x:.1f}' y='{y}' width='{cw0:.1f}' height='{card_h}' rx='10' fill='url(#card)' stroke='{ORANGE}' stroke-opacity='.72' stroke-width='2'/>")
                  out.append(icon(kind,x+16,y+16,54))
                  out.append(f"<text x='{x+82:.1f}' y='{y+28}' fill='{ORANGE}' font-family='DejaVu Sans Mono' font-weight='700' font-size='{max(13,int(w*.017))}'>{num}</text>")
                  out.append(f"<text x='{x+82:.1f}' y='{y+58}' fill='{WHITE}' font-family='DejaVu Sans' font-weight='700' font-size='{max(16,int(w*.022))}'>{title}</text>")
                  out.append(f"<text x='{x+16:.1f}' y='{y+card_h-26}' fill='{CYAN}' fill-opacity='.92' font-family='DejaVu Sans' font-size='{max(12,int(w*.016))}'>{desc}</text>")
                  out.append(f"<line x1='{x+14:.1f}' y1='{y+card_h-8}' x2='{x+cw0-14:.1f}' y2='{y+card_h-8}' stroke='{ORANGE2}' stroke-opacity='.92' stroke-width='2'/>")
              out.append('</svg>'); return ''.join(out)

          specs=[('wide',910,512,svg_wide),('mobile',900,1600,svg_mobile),('phone',900,1948,svg_mobile)]
          for name,w,h,fn in specs:
              p=Path(f'.tmp-v39/{name}.svg'); p.write_text(fn(w,h),encoding='utf-8')
          PY
          rsvg-convert .tmp-v39/wide.svg -o .tmp-v39/wide.png
          rsvg-convert .tmp-v39/mobile.svg -o .tmp-v39/mobile.png
          rsvg-convert .tmp-v39/phone.svg -o .tmp-v39/phone.png

      - name: Integrar tarjetas en los vídeos
        shell: bash
        run: |
          set -euo pipefail
          WIDE=cluster-video-project-3-1-fluid-coach.mp4
          MOBILE=cluster-video-project-3-1-fluid-coach-mobile.mp4
          PHONE=cluster-video-project-3-1-fluid-coach-phone-v31.mp4
          [ -f "$WIDE" ] || WIDE=cluster-video-project-3-1-fluid-coach-cards-v38.mp4
          [ -f "$MOBILE" ] || MOBILE=cluster-video-project-3-1-fluid-coach-mobile-cards-v38.mp4
          [ -f "$PHONE" ] || PHONE=cluster-video-project-3-1-fluid-coach-phone-cards-v38.mp4

          ffmpeg -y -i "$WIDE" -loop 1 -i .tmp-v39/wide.png -filter_complex "[0:v][1:v]overlay=0:0:format=auto" -map 0:a? -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p -c:a copy -shortest cluster-video-project-3-1-fluid-coach-cards-v39.mp4
          ffmpeg -y -i "$MOBILE" -loop 1 -i .tmp-v39/mobile.png -filter_complex "[0:v][1:v]overlay=0:0:format=auto" -map 0:a? -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -c:a copy -shortest cluster-video-project-3-1-fluid-coach-mobile-cards-v39.mp4
          ffmpeg -y -i "$PHONE" -loop 1 -i .tmp-v39/phone.png -filter_complex "[0:v][1:v]overlay=0:0:format=auto" -map 0:a? -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -c:a copy -shortest cluster-video-project-3-1-fluid-coach-phone-cards-v39.mp4

          ffmpeg -y -ss 0.8 -i cluster-video-project-3-1-fluid-coach-cards-v39.mp4 -frames:v 1 -q:v 72 cluster-video-project-3-1-fluid-coach-cards-v39-poster-wide.webp
          ffmpeg -y -ss 0.8 -i cluster-video-project-3-1-fluid-coach-mobile-cards-v39.mp4 -frames:v 1 -q:v 72 cluster-video-project-3-1-fluid-coach-mobile-cards-v39-poster.webp
          ffmpeg -y -ss 0.8 -i cluster-video-project-3-1-fluid-coach-phone-cards-v39.mp4 -frames:v 1 -q:v 72 cluster-video-project-3-1-fluid-coach-phone-cards-v39-poster.webp

      - name: Activar v39 y ajustar hotspots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          repl={
            'cluster-video-project-3-1-fluid-coach-cards-v38-poster-wide.webp':'cluster-video-project-3-1-fluid-coach-cards-v39-poster-wide.webp',
            'cluster-video-project-3-1-fluid-coach-mobile-cards-v38-poster.webp':'cluster-video-project-3-1-fluid-coach-mobile-cards-v39-poster.webp',
            'cluster-video-project-3-1-fluid-coach-phone-cards-v38-poster.webp':'cluster-video-project-3-1-fluid-coach-phone-cards-v39-poster.webp',
            'cluster-video-project-3-1-fluid-coach-cards-v38.mp4?v=integrated-cards-38':'cluster-video-project-3-1-fluid-coach-cards-v39.mp4?v=integrated-cards-39',
            'cluster-video-project-3-1-fluid-coach-mobile-cards-v38.mp4?v=integrated-cards-38':'cluster-video-project-3-1-fluid-coach-mobile-cards-v39.mp4?v=integrated-cards-39',
            'cluster-video-project-3-1-fluid-coach-phone-cards-v38.mp4?v=integrated-cards-38':'cluster-video-project-3-1-fluid-coach-phone-cards-v39.mp4?v=integrated-cards-39',
          }
          for a,b in repl.items(): s=s.replace(a,b)
          link='<link rel="stylesheet" href="module-cards-reference-v39.css?v=39">'
          if link not in s:
              s=s.replace('<link rel="stylesheet" href="module-cards-integrated-v38.css?v=38">','<link rel="stylesheet" href="module-cards-integrated-v38.css?v=38">\n'+link)
          p.write_text(s,encoding='utf-8')
          PY
          cat > module-cards-reference-v39.css <<'CSS'
          /* MODULE-CARDS-REFERENCE-V39: hotspots alineados con las tarjetas ya horneadas en el vídeo */
          @media (min-width:901px) and (orientation:landscape){
            .ic-modules{left:2.65%!important;right:2.65%!important;bottom:1.55%!important;height:25.6%!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:.88%!important}
            .ic-modules button{border-radius:7px!important}
            .ic-modules button:hover,.ic-modules button:focus-visible,.ic-modules button.is-active,.ic-modules button[aria-expanded=true]{border-color:rgba(255,190,115,.72)!important;background:rgba(255,122,0,.035)!important;box-shadow:inset 0 0 22px rgba(255,122,0,.07),0 0 12px rgba(255,122,0,.10)!important;transform:translateY(-1px)!important}
          }
          @media (max-width:900px) and (orientation:portrait){
            .ic-modules{left:3.5%!important;right:3.5%!important;bottom:1.7%!important;height:24.8%!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important;gap:6px 7px!important}
            .ic-modules button{border-radius:10px!important}
          }
          CSS

      - name: Validar y publicar
        shell: bash
        run: |
          set -euo pipefail
          test -s cluster-video-project-3-1-fluid-coach-cards-v39.mp4
          test -s cluster-video-project-3-1-fluid-coach-mobile-cards-v39.mp4
          test -s cluster-video-project-3-1-fluid-coach-phone-cards-v39.mp4
          grep -q 'integrated-cards-39' index.html
          grep -q 'module-cards-reference-v39.css?v=39' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html module-cards-reference-v39.css cluster-video-project-3-1-fluid-coach-cards-v39.mp4 cluster-video-project-3-1-fluid-coach-mobile-cards-v39.mp4 cluster-video-project-3-1-fluid-coach-phone-cards-v39.mp4 cluster-video-project-3-1-fluid-coach-cards-v39-poster-wide.webp cluster-video-project-3-1-fluid-coach-mobile-cards-v39-poster.webp cluster-video-project-3-1-fluid-coach-phone-cards-v39-poster.webp
          git rm .github/workflows/refine-integrated-cards-v39.yml
          git commit -m 'Refina las tarjetas inferiores como parte real del clúster'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
