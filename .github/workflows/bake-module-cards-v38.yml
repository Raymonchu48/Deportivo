name: Bake integrated module cards v38
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bake-module-cards-v38.yml'
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar ffmpeg y render SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin fonts-dejavu-core

      - name: Crear overlays HUD integrados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-v38
          python3 - <<'PY'
          from pathlib import Path

          ORANGE='#ff9418'
          ORANGE2='#ffd08a'
          WHITE='#f7ffff'
          PANEL='#031722'
          EDGE='#ff8a12'

          icons = {
            'training': "<path d='M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12' fill='none' stroke='{c}' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/>",
            'nutrition': "<path d='M12 7c-2.8-3.1-7-1.2-7 3.1C5 15.7 8.5 20 12 20s7-4.3 7-9.9C19 5.8 14.8 3.9 12 7Z' fill='none' stroke='{c}' stroke-width='1.8'/><path d='M12 7c.2-2.7 1.6-4.1 4-4M15 3c1.6.2 2.6.8 3.2 2' fill='none' stroke='{c}' stroke-width='1.8' stroke-linecap='round'/>",
            'mind': "<path d='M9.5 4.3a3.4 3.4 0 0 0-4.4 3.2 3.2 3.2 0 0 0 .4 1.5A3.8 3.8 0 0 0 7 16.3V20h5V5.1a3.5 3.5 0 0 0-2.5-.8ZM14.5 4.3a3.4 3.4 0 0 1 4.4 3.2 3.2 3.2 0 0 1-.4 1.5 3.8 3.8 0 0 1-1.5 7.3V20h-5V5.1a3.5 3.5 0 0 1 2.5-.8Z' fill='none' stroke='{c}' stroke-width='1.5'/><path d='M8 9h2M14 8h2M8 13h2M14 13h2' stroke='{c}' stroke-width='1.5' stroke-linecap='round'/>",
            'recovery': "<path d='M20.8 8.4c0 5.4-8.8 11-8.8 11S3.2 13.8 3.2 8.4A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.2Z' fill='none' stroke='{c}' stroke-width='1.7'/><path d='M6.5 11h3l1.1-2.4 2.1 5 1.3-2.6h3.5' fill='none' stroke='{c}' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'/>",
            'management': "<path d='M4 20V10h4v10M10 20V4h4v16M16 20v-7h4v7M3 20h18' fill='none' stroke='{c}' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/>",
          }

          cards=[('01','Entrenamiento','training'),('02','Nutrición','nutrition'),('03','Psicología','mind'),('04','Recuperación','recovery'),('05','Gestión','management')]

          def icon_group(kind, x, y, size):
              scale=size/24
              return f"<g transform='translate({x} {y}) scale({scale})'>" + icons[kind].format(c=ORANGE) + "</g>"

          def svg_wide(w,h):
              strip_y=int(h*0.815)
              card_y=int(h*0.842)
              card_h=h-card_y-5
              margin=14; gap=6
              card_w=(w-2*margin-4*gap)/5
              parts=[f"""<svg xmlns='http://www.w3.org/2000/svg' width='{w}' height='{h}' viewBox='0 0 {w} {h}'>
              <defs>
                <linearGradient id='strip' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#03131d' stop-opacity='.10'/><stop offset='.23' stop-color='#03131d' stop-opacity='.84'/><stop offset='1' stop-color='#020e16' stop-opacity='.96'/></linearGradient>
                <linearGradient id='card' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#061d29' stop-opacity='.96'/><stop offset='1' stop-color='#02131c' stop-opacity='.93'/></linearGradient>
              </defs>
              <rect x='0' y='{strip_y}' width='{w}' height='{h-strip_y}' fill='url(#strip)'/>
              <text x='{w/2}' y='{card_y-8}' text-anchor='middle' fill='{ORANGE}' font-family='DejaVu Sans Mono' font-weight='700' font-size='7' letter-spacing='2'>EXPLORA LOS MÓDULOS</text>"""]
              for i,(num,title,kind) in enumerate(cards):
                  x=margin+i*(card_w+gap)
                  parts.append(f"<rect x='{x:.1f}' y='{card_y}' width='{card_w:.1f}' height='{card_h}' fill='url(#card)' stroke='{EDGE}' stroke-opacity='.88' stroke-width='1.2'/>")
                  parts.append(f"<rect x='{x+8:.1f}' y='{card_y+9}' width='38' height='38' fill='#071d27' fill-opacity='.96' stroke='{ORANGE}' stroke-opacity='.78' stroke-width='1'/>")
                  parts.append(icon_group(kind,x+15,card_y+16,24))
                  parts.append(f"<text x='{x+55:.1f}' y='{card_y+24}' fill='{ORANGE}' font-family='DejaVu Sans Mono' font-weight='700' font-size='8'>{num}</text>")
                  parts.append(f"<text x='{x+55:.1f}' y='{card_y+45}' fill='{WHITE}' font-family='DejaVu Sans' font-weight='700' font-size='10'>{title}</text>")
                  parts.append(f"<line x1='{x+8:.1f}' x2='{x+card_w-8:.1f}' y1='{card_y+card_h-4}' y2='{card_y+card_h-4}' stroke='{ORANGE2}' stroke-opacity='.92' stroke-width='1.2'/>")
              parts.append('</svg>')
              return ''.join(parts)

          def svg_mobile(w,h):
              strip_y=int(h*0.745)
              top_y=int(h*0.785)
              bottom_y=int(h*0.875)
              margin=int(w*0.035); gap=int(w*0.012)
              top_w=(w-2*margin-2*gap)/3
              card_h=int(h*0.078)
              parts=[f"""<svg xmlns='http://www.w3.org/2000/svg' width='{w}' height='{h}' viewBox='0 0 {w} {h}'>
              <defs>
                <linearGradient id='strip' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#03131d' stop-opacity='.06'/><stop offset='.18' stop-color='#03131d' stop-opacity='.86'/><stop offset='1' stop-color='#020e16' stop-opacity='.97'/></linearGradient>
                <linearGradient id='card' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#061d29' stop-opacity='.96'/><stop offset='1' stop-color='#02131c' stop-opacity='.94'/></linearGradient>
              </defs>
              <rect x='0' y='{strip_y}' width='{w}' height='{h-strip_y}' fill='url(#strip)'/>
              <text x='{w/2}' y='{top_y-18}' text-anchor='middle' fill='{ORANGE}' font-family='DejaVu Sans Mono' font-weight='700' font-size='{max(12,int(w*.017))}' letter-spacing='3'>EXPLORA LOS MÓDULOS</text>"""]
              positions=[]
              for i in range(3): positions.append((margin+i*(top_w+gap),top_y,top_w))
              bottom_w=top_w
              total2=2*bottom_w+gap
              start=(w-total2)/2
              positions.append((start,bottom_y,bottom_w)); positions.append((start+bottom_w+gap,bottom_y,bottom_w))
              for (num,title,kind),(x,y,cw) in zip(cards,positions):
                  parts.append(f"<rect x='{x:.1f}' y='{y}' width='{cw:.1f}' height='{card_h}' fill='url(#card)' stroke='{EDGE}' stroke-opacity='.88' stroke-width='2'/>")
                  ib=int(card_h*.34); ix=x+14; iy=y+14
                  parts.append(f"<rect x='{ix:.1f}' y='{iy}' width='{ib}' height='{ib}' fill='#071d27' fill-opacity='.96' stroke='{ORANGE}' stroke-opacity='.80' stroke-width='1.5'/>")
                  parts.append(icon_group(kind,ix+7,iy+7,ib-14))
                  tx=ix+ib+14
                  parts.append(f"<text x='{tx:.1f}' y='{y+card_h*.38:.1f}' fill='{ORANGE}' font-family='DejaVu Sans Mono' font-weight='700' font-size='{max(14,int(w*.017))}'>{num}</text>")
                  parts.append(f"<text x='{tx:.1f}' y='{y+card_h*.67:.1f}' fill='{WHITE}' font-family='DejaVu Sans' font-weight='700' font-size='{max(18,int(w*.023))}'>{title}</text>")
                  parts.append(f"<line x1='{x+14:.1f}' x2='{x+cw-14:.1f}' y1='{y+card_h-5}' y2='{y+card_h-5}' stroke='{ORANGE2}' stroke-opacity='.92' stroke-width='2'/>")
              parts.append('</svg>')
              return ''.join(parts)

          Path('.tmp-v38/overlay-wide.svg').write_text(svg_wide(910,512),encoding='utf-8')
          Path('.tmp-v38/overlay-mobile.svg').write_text(svg_mobile(900,1600),encoding='utf-8')
          Path('.tmp-v38/overlay-phone.svg').write_text(svg_mobile(900,1948),encoding='utf-8')
          PY

          rsvg-convert .tmp-v38/overlay-wide.svg -o .tmp-v38/overlay-wide.png
          rsvg-convert .tmp-v38/overlay-mobile.svg -o .tmp-v38/overlay-mobile.png
          rsvg-convert .tmp-v38/overlay-phone.svg -o .tmp-v38/overlay-phone.png

      - name: Integrar tarjetas en los vídeos
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 cluster-video-project-3-1-fluid-coach.mp4 | grep -qx '910x512'
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 cluster-video-project-3-1-fluid-coach-mobile.mp4 | grep -qx '900x1600'
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 cluster-video-project-3-1-fluid-coach-phone-v31.mp4 | grep -qx '900x1948'

          ffmpeg -y -i cluster-video-project-3-1-fluid-coach.mp4 -loop 1 -i .tmp-v38/overlay-wide.png \
            -filter_complex '[0:v][1:v]overlay=0:0:shortest=1[v]' -map '[v]' -map 0:a? \
            -c:v libx264 -preset medium -crf 16 -pix_fmt yuv420p -c:a copy -movflags +faststart \
            cluster-video-project-3-1-fluid-coach-cards-v38.mp4

          ffmpeg -y -i cluster-video-project-3-1-fluid-coach-mobile.mp4 -loop 1 -i .tmp-v38/overlay-mobile.png \
            -filter_complex '[0:v][1:v]overlay=0:0:shortest=1[v]' -map '[v]' -map 0:a? \
            -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -c:a copy -movflags +faststart \
            cluster-video-project-3-1-fluid-coach-mobile-cards-v38.mp4

          ffmpeg -y -i cluster-video-project-3-1-fluid-coach-phone-v31.mp4 -loop 1 -i .tmp-v38/overlay-phone.png \
            -filter_complex '[0:v][1:v]overlay=0:0:shortest=1[v]' -map '[v]' -map 0:a? \
            -c:v libx264 -preset medium -crf 17 -pix_fmt yuv420p -c:a copy -movflags +faststart \
            cluster-video-project-3-1-fluid-coach-phone-cards-v38.mp4

          ffmpeg -y -ss 0.35 -i cluster-video-project-3-1-fluid-coach-cards-v38.mp4 -frames:v 1 -q:v 82 cluster-video-project-3-1-fluid-coach-cards-v38-poster-wide.webp
          ffmpeg -y -ss 0.35 -i cluster-video-project-3-1-fluid-coach-mobile-cards-v38.mp4 -frames:v 1 -q:v 82 cluster-video-project-3-1-fluid-coach-mobile-cards-v38-poster.webp
          ffmpeg -y -ss 0.35 -i cluster-video-project-3-1-fluid-coach-phone-cards-v38.mp4 -frames:v 1 -q:v 82 cluster-video-project-3-1-fluid-coach-phone-cards-v38-poster.webp

      - name: Activar vídeos integrados y hotspots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            'cluster-video-project-3-1-fluid-coach-poster-wide.webp':'cluster-video-project-3-1-fluid-coach-cards-v38-poster-wide.webp',
            'cluster-video-project-3-1-fluid-coach-poster-mobile.webp':'cluster-video-project-3-1-fluid-coach-mobile-cards-v38-poster.webp',
            'cluster-video-project-3-1-fluid-coach-poster-phone-v31.webp':'cluster-video-project-3-1-fluid-coach-phone-cards-v38-poster.webp',
            'cluster-video-project-3-1-fluid-coach-phone-v31.mp4?v=mobile-final-31':'cluster-video-project-3-1-fluid-coach-phone-cards-v38.mp4?v=integrated-cards-38',
            'cluster-video-project-3-1-fluid-coach-mobile.mp4?v=coach-enhanced-28':'cluster-video-project-3-1-fluid-coach-mobile-cards-v38.mp4?v=integrated-cards-38',
            'cluster-video-project-3-1-fluid-coach.mp4?v=coach-enhanced-28':'cluster-video-project-3-1-fluid-coach-cards-v38.mp4?v=integrated-cards-38',
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit(f'No se encontró {old}')
              s=s.replace(old,new)
          link='<link rel="stylesheet" href="module-cards-integrated-v38.css?v=38">'
          marker='<link rel="stylesheet" href="top-text-mask-v37.css?v=37">'
          if link not in s:
              if marker not in s: raise SystemExit('No se encontró top-text-mask-v37')
              s=s.replace(marker,marker+'\n'+link,1)
          p.write_text(s,encoding='utf-8')
          PY

          grep -q 'module-cards-integrated-v38.css?v=38' index.html
          grep -q 'fluid-coach-cards-v38.mp4?v=integrated-cards-38' index.html
          grep -q 'fluid-coach-mobile-cards-v38.mp4?v=integrated-cards-38' index.html
          grep -q 'fluid-coach-phone-cards-v38.mp4?v=integrated-cards-38' index.html

      - name: Publicar versión integrada y retirar workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html module-cards-integrated-v38.css \
            cluster-video-project-3-1-fluid-coach-cards-v38.mp4 \
            cluster-video-project-3-1-fluid-coach-mobile-cards-v38.mp4 \
            cluster-video-project-3-1-fluid-coach-phone-cards-v38.mp4 \
            cluster-video-project-3-1-fluid-coach-cards-v38-poster-wide.webp \
            cluster-video-project-3-1-fluid-coach-mobile-cards-v38-poster.webp \
            cluster-video-project-3-1-fluid-coach-phone-cards-v38-poster.webp
          git rm .github/workflows/bake-module-cards-v38.yml
          git commit -m 'Integra las tarjetas de módulos dentro del clúster'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
