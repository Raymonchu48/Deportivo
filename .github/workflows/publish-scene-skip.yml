name: Publicar salto de escena incoherente
on:
  push:
    paths:
      - '.github/workflows/publish-scene-skip.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar caché del JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='cluster-image.js?v=video-project-3-1-15'
          new='cluster-image.js?v=video-project-3-1-24'
          if old not in s and new not in s:
              raise SystemExit('No se encontró la referencia esperada del JS')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q 'cluster-image.js?v=video-project-3-1-24' index.html
          grep -q 'omittedVideoRanges=\[\[13.90,16.40\]\]' cluster-image.js
          grep -q "mind:12.70" cluster-image.js
      - name: Publicar y retirar workflow temporal
        run: |
          rm .github/workflows/publish-scene-skip.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cluster-image.js .github/workflows/publish-scene-skip.yml
          git commit -m 'Omite tramo incoherente del vídeo del clúster' || true
          git push
