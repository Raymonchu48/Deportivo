name: Slim transparent cards v42
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/slim-transparent-cards-v42.yml'
permissions:
  contents: write
jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin fonts-dejavu-core

      - name: Crear overlays finos y transparentes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp-v42
          python3 - <<'PY'
          from pathlib import Path
          O='#ff9418'; O2='#ffd08a'; W='#f7ffff'; C='#9eefff'; P='#041722'; P2='#06232f'
          cards=[('01','Entrenamiento','Plan de cargas','training'),('02','Nutrición','Balance nutricional','nutrition'),('03','Psicología','Foco y adherencia','mind'),('04','Recuperación','Descanso y movilidad','recovery'),('05','Gestión','Planificación y control','management')]
          icons={
          'training':"<path d='M3 10h3v4H3zm15 0h3v4h-3zM6 8h2v8H6zm10 0h2v8h-2zM8 11h8v2H8z' fill='none' stroke='{c}' stroke-width='1.5' stroke-linejoin='round'/>",
          'nutrition':"<path d='M12 7c-2.8-3.1-7-1.2-7 3.1C5 15.7 8.5 20 12 20s7-4.3 7-9.9C19 5.8 14.8 3.9 12 7Z' fill='none' stroke='{c}' stroke-width='1.7'/><path d='M12 7c.2-2.7 1.6-4.1 4-4M18.5 5v14M16 5v6m5-6v6' fill='none' stroke='{c}' stroke-width='1.5' stroke-linecap='round'/>",
          'mind':"<path d='M9.5 4.2a3.4 3.4 0 0 0-4.3 3.2c0 .6.1 1.1.4 1.6A3.8 3.8 0 0 0 7 16.3V20h5V5a3.5 3.5 0 0 0-2.5-.8ZM14.5 4.2a3.4 3.4 0 0 1 4.3 3.2c0 .6-.1 1.1-.4 1.6a3.8 3.8 0 0 1-1.4 7.3V20h-5V5a3.5 3.5 0 0 1 2.5-.8Z' fill='none' stroke='{c}' stroke-width='1.5'/><path d='M7.5 9h2M14.5 8h2M8 13h2M14 13h2' stroke='{c}' stroke-width='1.4' stroke-linecap='round'/>",
          'recovery':"<path d='M20.8 8.4c0 5.4-8.8 11-8.8 11S3.2 13.8 3.2 8.4A4.6 4.6 0 0 1 12 6.2a4.6 4.6 0 0 1 8.8 2.2Z' fill='none' stroke='{c}' stroke-width='1.7'/><path d='M6.5 11h3l1.1-2.4 2.1 5 1.3-2.6h3.5' fill='none' stroke='{c}' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>",
          'management':"<rect x='4' y='5' width='16' height='15' rx='2' fill='none' stroke='{c}' stroke-width='1.6'/><path d='M8 3v4M16 3v4M4 9h16M8 13h2M12 13h2M16 13h1M8 16h2M12 16h5' stroke='{c}' stroke-width='1.4' stroke-linecap='round'/>"
          }
          def ico(k,x,y,s): return f"<g transform='translate({x} {y}) scale({s/24})'>"+icons[k].format(c=O)+"</g>"
          def wide(w,h):
              veil=int(h*.79); y=int(h*.845); ch=h-y-8; m=12; g=7; cw=(w-2*m-4*g)/5
              z=[f"<svg xmlns='http://www.w3.org/2000/svg' width='{w}' height='{h}'><defs><linearGradient id='v' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#021019' stop-opacity='0'/><stop offset='.35' stop-color='#021019' stop-opacity='.28'/><stop offset='1' stop-color='#020d14' stop-opacity='.62'/></linearGradient><linearGradient id='c' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='{P2}' stop-opacity='.28'/><stop offset='1' stop-color='{P}' stop-opacity='.40'/></linearGradient></defs><rect x='0' y='{veil}' width='{w}' height='{h-veil}' fill='url(#v)'/><text x='{w/2}' y='{y-10}' text-anchor='middle' fill='{O}' font-family='DejaVu Sans Mono' font-weight='700' font-size='6.7' letter-spacing='2.2'>EXPLORA LOS MÓDULOS</text>"]
              for i,(n,t,d,k) in enumerate(cards):
                  x=m+i*(cw+g)
                  z += [f"<rect x='{x:.1f}' y='{y}' width='{cw:.1f}' height='{ch}' rx='6' fill='url(#c)' stroke='{O}' stroke-opacity='.78' stroke-width='1'/>",ico(k,x+10,y+17,31),f"<text x='{x+49:.1f}' y='{y+15}' fill='{O}' font-family='DejaVu Sans Mono' font-weight='700' font-size='6.2'>{n}</text>",f"<text x='{x+49:.1f}' y='{y+32}' fill='{W}' font-family='DejaVu Sans' font-weight='700' font-size='8.7'>{t}</text>",f"<text x='{x+49:.1f}' y='{y+49}' fill='{C}' fill-opacity='.92' font-family='DejaVu Sans' font-size='6.8'>{d}</text>",f"<line x1='{x+10:.1f}' y1='{y+ch-4}' x2='{x+cw-10:.1f}' y2='{y+ch-4}' stroke='{O2}' stroke-opacity='.84' stroke-width='1'/>"]
              z.append('</svg>'); return ''.join(z)
          def mobile(w,h):
              veil=int(h*.75); ty=int(h*.80); by=int(h*.895); ch=int(h*.072); m=int(w*.035); g=int(w*.014); cw=(w-2*m-2*g)/3
              pos=[(m+i*(cw+g),ty,cw) for i in range(3)]; s=(w-(2*cw+g))/2; pos += [(s,by,cw),(s+cw+g,by,cw)]
              z=[f"<svg xmlns='http://www.w3.org/2000/svg' width='{w}' height='{h}'><defs><linearGradient id='v' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#021019' stop-opacity='0'/><stop offset='.30' stop-color='#021019' stop-opacity='.30'/><stop offset='1' stop-color='#020d14' stop-opacity='.64'/></linearGradient><linearGradient id='c' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='{P2}' stop-opacity='.30'/><stop offset='1' stop-color='{P}' stop-opacity='.42'/></linearGradient></defs><rect x='0' y='{veil}' width='{w}' height='{h-veil}' fill='url(#v)'/><text x='{w/2}' y='{ty-18}' text-anchor='middle' fill='{O}' font-family='DejaVu Sans Mono' font-weight='700' font-size='13' letter-spacing='3'>EXPLORA LOS MÓDULOS</text>"]
              for (n,t,d,k),(x,y,cw0) in zip(cards,pos):
                  z += [f"<rect x='{x:.1f}' y='{y}' width='{cw0:.1f}' height='{ch}' rx='9' fill='url(#c)' stroke='{O}' stroke-opacity='.80' stroke-width='1.8'/>",ico(k,x+13,y+18,42),f"<text x='{x+62:.1f}' y='{y+25}' fill='{O}' font-family='DejaVu Sans Mono' font-weight='700' font-size='12'>{n}</text>",f"<text x='{x+62:.1f}' y='{y+51}' fill='{W}' font-family='DejaVu Sans' font-weight='700' font-size='16'>{t}</text>",f"<text x='{x+14:.1f}' y='{y+ch-17}' fill='{C}' fill-opacity='.93' font-family='DejaVu Sans' font-size='12'>{d}</text>",f"<line x1='{x+13:.1f}' y1='{y+ch-6}' x2='{x+cw0-13:.1f}' y2='{y+ch-6}' stroke='{O2}' stroke-opacity='.86' stroke-width='1.5'/>"]
              z.append('</svg>'); return ''.join(z)
          for name,w,h,fn in [('wide',910,512,wide),('mobile',900,1600,mobile),('phone',900,1948,mobile)]: Path(f'.tmp-v42/{name}.svg').write_text(fn(w,h),encoding='utf-8')
          PY
          rsvg-convert .tmp-v42/wide.svg -o .tmp-v42/wide.png
          rsvg-convert .tmp-v42/mobile.svg -o .tmp-v42/mobile.png
          rsvg-convert .tmp-v42/phone.svg -o .tmp-v42/phone.png

      - name: Renderizar vídeos v42
        shell: bash
        run: |
          set -euo pipefail
          render(){ src="$1"; png="$2"; out="$3"; crf="$4"; frac="$5"; d=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$src"); ffmpeg -y -i "$src" -loop 1 -framerate 30 -i "$png" -filter_complex "[0:v]split[base][low];[low]crop=iw:ih*${frac}:0:ih*(1-${frac}),boxblur=8:2[blur];[base][blur]overlay=0:H-h[bg];[bg][1:v]overlay=0:0:format=auto:shortest=1[v]" -map "[v]" -map 0:a? -c:v libx264 -preset veryfast -crf "$crf" -pix_fmt yuv420p -c:a copy -t "$d" "$out"; }
          render cluster-video-project-3-1-fluid-coach.mp4 .tmp-v42/wide.png cluster-video-project-3-1-fluid-coach-cards-v42.mp4 16 0.19
          render cluster-video-project-3-1-fluid-coach-mobile.mp4 .tmp-v42/mobile.png cluster-video-project-3-1-fluid-coach-mobile-cards-v42.mp4 17 0.27
          render cluster-video-project-3-1-fluid-coach-phone-v31.mp4 .tmp-v42/phone.png cluster-video-project-3-1-fluid-coach-phone-cards-v42.mp4 17 0.27
          ffmpeg -y -ss 0.8 -i cluster-video-project-3-1-fluid-coach-cards-v42.mp4 -frames:v 1 cluster-video-project-3-1-fluid-coach-cards-v42-poster-wide.webp
          ffmpeg -y -ss 0.8 -i cluster-video-project-3-1-fluid-coach-mobile-cards-v42.mp4 -frames:v 1 cluster-video-project-3-1-fluid-coach-mobile-cards-v42-poster.webp
          ffmpeg -y -ss 0.8 -i cluster-video-project-3-1-fluid-coach-phone-cards-v42.mp4 -frames:v 1 cluster-video-project-3-1-fluid-coach-phone-cards-v42-poster.webp

      - name: Activar v42 y ajustar hotspots
        shell: bash
        run: |
          set -euo pipefail
          cat > module-cards-reference-v42.css <<'CSS'
          @media (min-width:901px) and (orientation:landscape){
            .ic-modules{left:1.3%!important;right:1.3%!important;bottom:1.3%!important;height:13.8%!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:.78%!important}
            .ic-modules button{border-radius:6px!important}
            .ic-modules button:hover,.ic-modules button:focus-visible,.ic-modules button.is-active,.ic-modules button[aria-expanded=true]{border-color:rgba(255,190,115,.62)!important;background:rgba(255,122,0,.025)!important;box-shadow:inset 0 0 14px rgba(255,122,0,.045),0 0 8px rgba(255,122,0,.07)!important;transform:translateY(-1px)!important}
            .ic-top-actions:before{background:linear-gradient(90deg,rgba(3,13,20,.18) 0%,rgba(4,17,25,.28) 12%,rgba(4,18,26,.32) 50%,rgba(4,17,25,.28) 88%,rgba(3,13,20,.18) 100%)!important;box-shadow:0 0 8px rgba(0,0,0,.24)!important;backdrop-filter:blur(3px)!important;-webkit-backdrop-filter:blur(3px)!important}
            .ic-top-actions a,.ic-top-actions button{background:linear-gradient(90deg,rgba(4,19,27,.025) 0%,rgba(6,25,35,.07) 45%,rgba(6,25,35,.14) 100%)!important;border-color:rgba(255,122,0,.56)!important;border-right-color:rgba(255,154,36,.72)!important;box-shadow:inset 0 0 8px rgba(255,122,0,.018),0 0 7px rgba(255,122,0,.028)!important;backdrop-filter:blur(1px)!important;-webkit-backdrop-filter:blur(1px)!important}
          }
          @media (max-width:900px) and (orientation:portrait){
            .ic-modules{left:3.5%!important;right:3.5%!important;bottom:1.5%!important;height:18.5%!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(0,1fr))!important;gap:6px 7px!important}
            .ic-modules button{border-radius:9px!important}
          }
          CSS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('cluster-video-project-3-1-fluid-coach-cards-v41-poster-wide.webp','cluster-video-project-3-1-fluid-coach-cards-v42-poster-wide.webp')
          s=s.replace('cluster-video-project-3-1-fluid-coach-mobile-cards-v41-poster.webp','cluster-video-project-3-1-fluid-coach-mobile-cards-v42-poster.webp')
          s=s.replace('cluster-video-project-3-1-fluid-coach-phone-cards-v41-poster.webp','cluster-video-project-3-1-fluid-coach-phone-cards-v42-poster.webp')
          s=s.replace('cluster-video-project-3-1-fluid-coach-cards-v41.mp4?v=integrated-cards-41','cluster-video-project-3-1-fluid-coach-cards-v42.mp4?v=slim-transparent-42')
          s=s.replace('cluster-video-project-3-1-fluid-coach-mobile-cards-v41.mp4?v=integrated-cards-41','cluster-video-project-3-1-fluid-coach-mobile-cards-v42.mp4?v=slim-transparent-42')
          s=s.replace('cluster-video-project-3-1-fluid-coach-phone-cards-v41.mp4?v=integrated-cards-41','cluster-video-project-3-1-fluid-coach-phone-cards-v42.mp4?v=slim-transparent-42')
          s=s.replace('<link rel="stylesheet" href="module-cards-reference-v41.css?v=41">','<link rel="stylesheet" href="module-cards-reference-v42.css?v=42">')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Publicar y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/slim-transparent-cards-v42.yml
          git add -A
          git commit -m "Afina y transparenta las tarjetas del clúster" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
