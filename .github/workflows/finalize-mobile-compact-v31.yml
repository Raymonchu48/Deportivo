name: Finalize mobile compact v31
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-mobile-compact-v31.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Build compact phone video
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -i cluster-video-project-3-1-fluid-coach.mp4 \
            -filter_complex "[0:v]split=2[bg][fg];[bg]scale=900:1948:force_original_aspect_ratio=increase,crop=900:1948,gblur=sigma=32,eq=brightness=-0.025:contrast=1.05:saturation=0.98[bg2];[fg]scale=1100:-2[fg2];[bg2][fg2]overlay=x=-100:y=545:format=auto" \
            -an -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p -movflags +faststart \
            cluster-video-project-3-1-fluid-coach-phone-v31.mp4
          ffmpeg -y -ss 0.8 -i cluster-video-project-3-1-fluid-coach-phone-v31.mp4 -frames:v 1 -c:v libwebp -quality 90 cluster-video-project-3-1-fluid-coach-poster-phone-v31.webp
      - name: Apply final mobile layout
        shell: bash
        run: |
          set -euo pipefail
          cat > mobile-cluster-fix.css <<'CSS'
          /* MOBILE-CLUSTER-FINAL-V31 */
          @media (max-width:900px) and (orientation:portrait){
            .ic-cluster{height:100svh!important;min-height:100svh!important;overflow:hidden!important}
            .ic-stage{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;aspect-ratio:auto!important;margin:0!important;transform:none!important}
            .ic-art,.ic-motion-video{inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center center!important}
            .ic-main-title{top:2.5%!important;left:3%!important;right:3%!important;height:5.4%!important;font-size:clamp(10px,2.9vw,15px)!important;letter-spacing:.035em!important;box-shadow:0 0 14px 7px rgba(7,25,37,.80)!important}
            .ic-top-actions{top:9.3%!important;left:3.5%!important;right:3.5%!important;height:9.2%!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:4px!important}
            .ic-top-actions a,.ic-top-actions button{min-width:0!important;min-height:0!important;height:100%!important;padding:6px 4px!important;justify-content:flex-end!important;background:linear-gradient(180deg,rgba(5,22,31,.08),rgba(6,25,35,.30) 58%,rgba(6,25,35,.56))!important;backdrop-filter:blur(3px)!important;-webkit-backdrop-filter:blur(3px)!important}
            .ic-top-actions span{display:none!important}
            .ic-top-actions strong{width:100%!important;font-size:clamp(8px,2.35vw,11px)!important;line-height:1.06!important;text-align:center!important;white-space:normal!important;overflow-wrap:anywhere!important}
            .ic-profile-thumb{top:5px!important;right:50%!important;transform:translateX(50%)!important;width:28px!important;height:31px!important;opacity:.76!important}
            .ic-modules{left:3%!important;right:3%!important;top:64%!important;bottom:auto!important;height:20.5%!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(46px,1fr))!important;gap:5px 6px!important}
            .ic-console-label{top:-12%!important;font-size:6px!important;letter-spacing:.18em!important}
            .ic-modules button{min-height:46px!important;padding:0 8px!important;background:linear-gradient(90deg,rgba(4,19,27,.05),rgba(6,25,35,.17) 42%,rgba(6,25,35,.42) 100%)!important;backdrop-filter:blur(2.5px)!important;-webkit-backdrop-filter:blur(2.5px)!important}
            .ic-num{font-size:7px!important}
            .ic-modules strong{font-size:clamp(8px,2.15vw,10px)!important}
            .ic-screen{position:fixed!important;inset:6px!important;width:auto!important;height:auto!important;max-height:none!important;transform:none!important}
          }
          @media (max-width:430px) and (orientation:portrait){
            .ic-main-title{top:2.3%!important;height:5.2%!important;font-size:clamp(10px,2.75vw,13px)!important}
            .ic-top-actions{top:8.8%!important;height:9%!important;left:3%!important;right:3%!important}
            .ic-top-actions strong{font-size:clamp(8px,2.25vw,10px)!important}
            .ic-profile-thumb{width:26px!important;height:29px!important}
            .ic-modules{left:2.8%!important;right:2.8%!important;top:63.5%!important;height:21%!important;gap:4px 5px!important}
            .ic-modules button{min-height:44px!important;padding:0 7px!important}
            .ic-modules strong{font-size:clamp(8px,2.05vw,9px)!important}
          }
          CSS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # replace whichever phone source is currently live
          import re
          s=re.sub(r'cluster-video-project-3-1-fluid-coach-phone(?:-v\d+)?\.mp4\?v=[^\"\']+', 'cluster-video-project-3-1-fluid-coach-phone-v31.mp4?v=mobile-final-31', s)
          s=re.sub(r'cluster-video-project-3-1-fluid-coach-poster-phone(?:-v\d+)?\.webp', 'cluster-video-project-3-1-fluid-coach-poster-phone-v31.webp', s)
          s=re.sub(r'mobile-cluster-fix\.css\?v=\d+', 'mobile-cluster-fix.css?v=31', s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          test -s cluster-video-project-3-1-fluid-coach-phone-v31.mp4
          test -s cluster-video-project-3-1-fluid-coach-poster-phone-v31.webp
          grep -q 'MOBILE-CLUSTER-FINAL-V31' mobile-cluster-fix.css
          grep -q 'mobile-cluster-fix.css?v=31' index.html
          grep -q 'cluster-video-project-3-1-fluid-coach-phone-v31.mp4?v=mobile-final-31' index.html
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=nw=1 cluster-video-project-3-1-fluid-coach-phone-v31.mp4
      - name: Commit and rebase
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mobile-cluster-fix.css cluster-video-project-3-1-fluid-coach-phone-v31.mp4 cluster-video-project-3-1-fluid-coach-poster-phone-v31.webp
          git commit -m 'Corrige definitivamente la estructura móvil del clúster'
          git rm .github/workflows/finalize-mobile-compact-v31.yml
          git commit --amend --no-edit
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
