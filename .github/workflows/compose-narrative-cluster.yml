name: Compose narrative sports cluster

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compose-narrative-cluster.yml'

permissions:
  contents: write

concurrency:
  group: compose-narrative-sports-cluster
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build narrative desktop and mobile videos
        shell: bash
        run: |
          set -euo pipefail
          git show de695a4ba08c49502cf8562a83c1ac162b7c56cf:cluster-main.mp4 > /tmp/cluster-clean.mp4

          ffmpeg -y -i cluster-reading-motion-wide.mp4 \
            -filter_complex '[0:v]split=2[bg][fg];[bg]scale=1280:720:force_original_aspect_ratio=increase,crop=1280:720,gblur=sigma=24[bg2];[fg]scale=1280:720:force_original_aspect_ratio=decrease[fg2];[bg2][fg2]overlay=(W-w)/2:(H-h)/2,fps=24,format=yuv420p,setsar=1[v]' \
            -map '[v]' -an -c:v libx264 -preset medium -crf 19 -movflags +faststart /tmp/coach-opening.mp4

          ffmpeg -y -i /tmp/coach-opening.mp4 -i /tmp/cluster-clean.mp4 \
            -filter_complex '[0:v]setpts=PTS-STARTPTS[a];[1:v]trim=start=2,setpts=PTS-STARTPTS[b];[a][b]xfade=transition=fade:duration=0.375:offset=2.0,fps=24,format=yuv420p[v]' \
            -map '[v]' -t 10 -an -c:v libx264 -preset medium -crf 19 -movflags +faststart cluster-narrative-motion-wide.mp4

          ffmpeg -y -i cluster-narrative-motion-wide.mp4 \
            -filter_complex '[0:v]split=2[bg][fg];[bg]scale=900:900:force_original_aspect_ratio=increase,crop=900:900,gblur=sigma=32,eq=brightness=-0.08:saturation=0.9[bg2];[fg]scale=900:900:force_original_aspect_ratio=decrease[fg2];[bg2][fg2]overlay=(W-w)/2:(H-h)/2,fps=24,format=yuv420p,setsar=1[v]' \
            -map '[v]' -an -c:v libx264 -preset medium -crf 20 -movflags +faststart cluster-narrative-motion-square.mp4

          ffmpeg -y -ss 0.08 -i cluster-narrative-motion-wide.mp4 -frames:v 1 -c:v libwebp -quality 84 cluster-narrative-poster-wide.webp
          ffmpeg -y -ss 0.08 -i cluster-narrative-motion-square.mp4 -frames:v 1 -c:v libwebp -quality 84 cluster-narrative-poster-square.webp

          ffprobe -v error -show_entries format=duration,size:stream=width,height,r_frame_rate -of json cluster-narrative-motion-wide.mp4
          ffprobe -v error -show_entries format=duration,size:stream=width,height,r_frame_rate -of json cluster-narrative-motion-square.mp4

      - name: Synchronize interface with video stages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          replacements = {
              'cluster-reading-poster-wide.webp': 'cluster-narrative-poster-wide.webp',
              'cluster-reading-poster-square.webp': 'cluster-narrative-poster-square.webp',
              'cluster-reading-motion-wide.mp4': 'cluster-narrative-motion-wide.mp4',
              'cluster-reading-motion-square.mp4': 'cluster-narrative-motion-square.mp4',
              'coach-reading-motion-10': 'narrative-cluster-11',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected index token: {old}')
              text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')

          css = Path('cluster-image.css')
          style = css.read_text(encoding='utf-8')
          for old, new in {
              'cluster-reading-poster-wide.webp': 'cluster-narrative-poster-wide.webp',
              'cluster-reading-poster-square.webp': 'cluster-narrative-poster-square.webp',
          }.items():
              if old not in style:
                  raise SystemExit(f'Missing expected CSS token: {old}')
              style = style.replace(old, new)
          css.write_text(style, encoding='utf-8')

          js = Path('cluster-image.js')
          script = js.read_text(encoding='utf-8')

          marker = "var motionVideo=document.querySelector('.ic-motion-video');"
          addition = """var motionVideo=document.querySelector('.ic-motion-video');\nvar videoResumeAfterScreen=false;\nvar cueTimes={training:.2,recovery:2.15,management:3.2,adapted:5.2,mind:7.2,nutrition:9.0};\nfunction reflectVideoCue(){\nif(!motionVideo||!screen.hidden)return;\nvar t=motionVideo.currentTime;var key=t>=9?'nutrition':t>=7?'mind':t>=5?'adapted':t>=3?'management':t>=2?'recovery':'training';\ndocument.querySelectorAll('.ic-modules button[data-open]').forEach(function(b){var active=b.dataset.open===key;b.classList.toggle('is-active',active);if(active)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});\n}\n"""
          if marker not in script:
              raise SystemExit('Missing motionVideo marker')
          script = script.replace(marker, addition, 1)

          old_reset = "document.querySelectorAll('[data-open]').forEach(function(b){var active=b.dataset.open===key;b.classList.toggle('is-active',active);if(b.tagName==='BUTTON')b.setAttribute('aria-expanded',String(active));});"
          new_reset = "document.querySelectorAll('[data-open]').forEach(function(b){var active=b.dataset.open===key;b.classList.toggle('is-active',active);if(b.tagName==='BUTTON')b.setAttribute('aria-expanded',String(active));if(b.closest('.ic-modules')){if(active)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');}});"
          if old_reset not in script:
              raise SystemExit('Missing resetButtons marker')
          script = script.replace(old_reset, new_reset, 1)

          old_open = "screen.hidden=false;cluster.classList.add('ic-screen-open');resetButtons(key);content.scrollTop=0;"
          new_open = "if(motionVideo){videoResumeAfterScreen=!motion.matches&&!document.hidden;if(cueTimes[key]!==undefined){try{motionVideo.currentTime=cueTimes[key];}catch(e){}}motionVideo.pause();}\nscreen.hidden=false;cluster.classList.add('ic-screen-open');resetButtons(key);content.scrollTop=0;"
          if old_open not in script:
              raise SystemExit('Missing open marker')
          script = script.replace(old_open, new_open, 1)

          old_close = "if(restore&&trigger&&document.contains(trigger))trigger.focus({preventScroll:true});"
          new_close = "if(motionVideo&&videoResumeAfterScreen&&!motion.matches&&!document.hidden){var resume=motionVideo.play();if(resume&&typeof resume.catch==='function')resume.catch(function(){});}videoResumeAfterScreen=false;reflectVideoCue();\nif(restore&&trigger&&document.contains(trigger))trigger.focus({preventScroll:true});"
          if old_close not in script:
              raise SystemExit('Missing close marker')
          script = script.replace(old_close, new_close, 1)

          old_canplay = "motionVideo.addEventListener('canplay',function(){motionVideo.classList.add('is-ready');syncMotion();},{once:true});"
          new_canplay = "motionVideo.addEventListener('canplay',function(){motionVideo.classList.add('is-ready');syncMotion();reflectVideoCue();},{once:true});\nmotionVideo.addEventListener('timeupdate',reflectVideoCue);\nmotionVideo.addEventListener('seeked',reflectVideoCue);"
          if old_canplay not in script:
              raise SystemExit('Missing canplay marker')
          script = script.replace(old_canplay, new_canplay, 1)

          js.write_text(script, encoding='utf-8')
          PY

      - name: Commit final cluster
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/compose-narrative-cluster.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integra narrativa completa e interacción sincronizada del clúster'
          git push
