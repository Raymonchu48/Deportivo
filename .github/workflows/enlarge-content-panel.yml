name: Ampliar panel de contenido responsive
on:
  push:
    paths:
      - '.github/workflows/enlarge-content-panel.yml'
permissions:
  contents: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ampliar panel y contenido
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cluster-image.css')
          s=p.read_text()
          a='/* LARGE-CONTENT-PANEL-START */'
          b='/* LARGE-CONTENT-PANEL-END */'
          if a in s and b in s:
              i=s.index(a); j=s.index(b,i)+len(b); s=s[:i]+s[j:]
          p.write_text(s.rstrip()+'\n')
          PY
          echo ' ' | tr -d ' ' | base64 -d >> cluster-image.css
          sed -i 's/cluster-image.css?v=video-project-3-1-17/cluster-image.css?v=video-project-3-1-18/g' index.html
      - name: Validar cambios
        run: |
          grep -q 'LARGE-CONTENT-PANEL-START' cluster-image.css
          grep -q 'left:12%;right:12%' cluster-image.css
          grep -q 'cluster-image.css?v=video-project-3-1-18' index.html
      - name: Publicar y retirar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/enlarge-content-panel.yml
          git add cluster-image.css index.html .github/workflows/enlarge-content-panel.yml
          git commit -m 'Amplía panel de contenido en desktop tablet y móvil'
          git push
