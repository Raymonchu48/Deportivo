name: Publicar estilo lateral en módulos inferiores
on:
  push:
    paths:
      - '.github/workflows/bump-module-tabs-cache.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar versión CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='panel-size-overrides.css?v=20'
          new='panel-size-overrides.css?v=22'
          if old not in s:
              raise SystemExit('No se encontró la referencia CSS esperada')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validar
        run: |
          grep -q 'panel-size-overrides.css?v=22' index.html
          grep -q 'LOWER-MODULES-SIDE-RAILS-START' panel-size-overrides.css
      - name: Publicar y retirar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/bump-module-tabs-cache.yml
          git add index.html panel-size-overrides.css .github/workflows/bump-module-tabs-cache.yml
          git commit -m 'Aplica estilo de pestañas laterales a módulos inferiores'
          git push
