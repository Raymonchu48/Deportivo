name: Refine mobile cluster v30
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-mobile-cluster-v30.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Build compact phone composition
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -i cluster-video-project-3-1-fluid-coach.mp4 \
            -filter_complex "[0:v]split=2[bg][fg];[bg]scale=900:1948:force_original_aspect_ratio=increase,crop=900:1948,gblur=sigma=32,eq=brightness=-0.025:contrast=1.05:saturation=0.98[bg2];[fg]scale=1100:-2[fg2];[bg2][fg2]overlay=x=-100:y=560:format=auto" \
            -an -c:v libx264 -preset slow -crf 17 -pix_fmt yuv420p -movflags +faststart \
            cluster-video-project-3-1-fluid-coach-phone-v30.mp4
          ffmpeg -y -ss 0.8 -i cluster-video-project-3-1-fluid-coach-phone-v30.mp4 -frames:v 1 -c:v libwebp -quality 90 cluster-video-project-3-1-fluid-coach-poster-phone-v30.webp
      - name: Rewrite phone CSS and references
        shell: bash
        run: |
          cat > mobile-cluster-fix.css <<'CSS'
          /* MOBILE-CLUSTER-COMPACT-V30 */
          @media (max-width:900px) and (orientation:portrait){
            .ic-cluster{height:100svh!important;min-height:100svh!important;overflow:hidden!important}
            .ic-stage{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;aspect-ratio:auto!important;margin:0!important;transform:none!important}
            .ic-art,.ic-motion-video{inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center center!important}
            .ic-main-title{top:2.2%!important;left:3%!important;right:3%!important;height:5.6%!important;font-size:clamp(11px,3vw,17px)!important;letter-spacing:.04em!important}
            .ic-top-actions{top:9.2%!important;left:4%!important;right:4%!important;height:10.2%!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:4px!important}
            .ic-top-actions a,.ic-top-actions button{min-width:0!important;min-height:0!important;height:100%!important;padding:7px 4px!important;justify-content:flex-end!important;background:linear-gradient(180deg,rgba(4,19,27,.12),rgba(6,25,35,.36) 58%,rgba(6,25,35,.54))!important;backdrop-filter:blur(3px)!important;-webkit-backdrop-filter:blur(3px)!important}
            .ic-top-actions span{display:none!important}
            .ic-top-actions strong{width:100%!important;font-size:clamp(9px,2.65vw,12px)!important;line-height:1.08!important;text-align:center!important;white-space:normal!important;overflow-wrap:anywhere!important}
            .ic-profile-thumb{top:6px!important;right:50%!important;transform:translateX(50%)!important;width:31px!important;height:34px!important;opacity:.72!important}
            .ic-modules{left:3.5%!important;right:3.5%!important;top:64%!important;bottom:auto!important;height:21%!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;grid-template-rows:repeat(2,minmax(48px,1fr))!important;gap:6px!important}
            .ic-console-label{top:-13%!important;font-size:7px!important}
            .ic-modules button{min-height:48px!important;padding:0 10px!important;background:linear-gradient(90deg,rgba(4,19,27,.08) 0%,rgba(6,25,35,.20) 45%,rgba(6,25,35,.46) 100%)!important;backdrop-filter:blur(3px)!important;-webkit-backdrop-filter:blur(3px)!important}
            .ic-modules strong{font-size:clamp(9px,2.45vw,12px)!important}
            .ic-screen{position:fixed!important;inset:6px!important;width:auto!important;height:auto!important;max-height:none!important;transform:none!important}
          }
          @media (max-width:420px) and (orientation:portrait){
            .ic-main-title{top:2.1%!important;font-size:clamp(10px,2.85vw,13px)!important}
            .ic-top-actions{top:8.9%!important;height:10.3%!important}
            .ic-top-actions strong{font-size:clamp(8px,2.55vw,10px)!important}
            .ic-modules{left:3%!important;right:3%!important;top:63.5%!important;height:22%!important;gap:5px!important}
            .ic-modules button{min-height:46px!important;padding:0 8px!important}
            .ic-modules strong{font-size:clamp(8px,2.3vw,10px)!important}
          }
          CSS
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('cluster-video-project-3-1-fluid-coach-phone.mp4?v=mobile-fullscreen-29','cluster-video-project-3-1-fluid-coach-phone-v30.mp4?v=mobile-compact-30')
          s=s.replace('cluster-video-project-3-1-fluid-coach-poster-phone.webp','cluster-video-project-3-1-fluid-coach-poster-phone-v30.webp')
          s=s.replace('mobile-cluster-fix.css?v=29','mobile-cluster-fix.css?v=30')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          test -s cluster-video-project-3-1-fluid-coach-phone-v30.mp4
          test -s cluster-video-project-3-1-fluid-coach-poster-phone-v30.webp
          grep -q 'mobile-cluster-fix.css?v=30' index.html
          grep -q 'cluster-video-project-3-1-fluid-coach-phone-v30.mp4?v=mobile-compact-30' index.html
          ffprobe -v error -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=nw=1 cluster-video-project-3-1-fluid-coach-phone-v30.mp4
      - name: Publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html mobile-cluster-fix.css cluster-video-project-3-1-fluid-coach-phone-v30.mp4 cluster-video-project-3-1-fluid-coach-poster-phone-v30.webp
          git commit -m 'Reestructura el clúster móvil en una composición compacta'
          git rm .github/workflows/refine-mobile-cluster-v30.yml
          git commit --amend --no-edit
          git push origin HEAD:main
