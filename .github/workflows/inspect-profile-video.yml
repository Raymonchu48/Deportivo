name: Inspect profile video
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-profile-video.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Compare repository videos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, pathlib, json
          def probe(p):
              r=subprocess.run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height','-show_entries','format=duration','-of','json',str(p)],capture_output=True,text=True)
              try:
                  j=json.loads(r.stdout); s=j['streams'][0]; return float(j['format']['duration']),s['width'],s['height']
              except Exception: return None
          def ahash(p,t):
              r=subprocess.run(['ffmpeg','-v','error','-ss',str(t),'-i',str(p),'-frames:v','1','-vf','scale=8:8,format=gray','-f','rawvideo','pipe:1'],capture_output=True)
              a=list(r.stdout)
              if len(a)!=64:return 'NA'
              m=sum(a)/64; v=0
              for x in a:v=(v<<1)|(x>=m)
              return f'{v:016x}'
          for p in sorted(pathlib.Path('.').rglob('*.mp4')):
              q=probe(p)
              if not q: continue
              dur,w,h=q
              if dur <= 15.5:
                  print(f'VIDEO={p}|duration={dur:.3f}|size={p.stat().st_size}|{w}x{h}|h1={ahash(p,1)}|h4={ahash(p,4)}|h7={ahash(p,7)}')
          PY