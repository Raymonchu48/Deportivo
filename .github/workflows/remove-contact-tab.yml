name: Quitar pestaña Contacto
on:
  push:
    paths:
      - '.github/workflows/remove-contact-tab.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar contacto duplicado
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a href="mailto:ramonalberto.curbalvega@gmail.com"><span>03 / DIRECTO</span><strong>Contacto</strong></a>\n'
          if old not in s:
              raise SystemExit('No se encontró la pestaña Contacto esperada')
          s = s.replace(old, '', 1)
          p.write_text(s)
          PY
      - name: Validar
        run: |
          ! grep -q '>Contacto</strong>' index.html
          grep -q '>Hablemos</strong>' index.html
          grep -q '>Descargar CV</strong>' index.html
          grep -q '>Carta de recomendación</strong>' index.html
      - name: Publicar y retirar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/remove-contact-tab.yml
          git add index.html .github/workflows/remove-contact-tab.yml
          git commit -m 'Elimina pestaña Contacto duplicada del clúster'
          git push
