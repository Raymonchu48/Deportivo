name: Activate module dropdown v44
on:
  push:
    paths:
      - module-actions-dropdown-v44.css
      - module-actions-dropdown-v44.js
      - .github/workflows/activate-module-dropdown-v44.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Activar módulos desplegables v44
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="module-actions-dropdown-v44.css?v=44">'
          js='<script src="module-actions-dropdown-v44.js?v=44" defer></script>'
          if css not in s:
              marker='<link rel="stylesheet" href="top-actions-dropdown-v43.css?v=43">'
              s=s.replace(marker, marker+'\n'+css)
          if js not in s:
              marker='<script src="top-actions-dropdown-v43.js?v=43" defer></script>'
              s=s.replace(marker, marker+'\n'+js)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar activación
        run: |
          grep -q 'module-actions-dropdown-v44.css?v=44' index.html
          grep -q 'module-actions-dropdown-v44.js?v=44' index.html
      - name: Publicar y retirar workflow temporal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/activate-module-dropdown-v44.yml
          git add index.html module-actions-dropdown-v44.css module-actions-dropdown-v44.js .github/workflows/activate-module-dropdown-v44.yml
          git commit -m 'Activa paneles desplegables en módulos inferiores' || true
          git push
