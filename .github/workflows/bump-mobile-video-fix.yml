name: Aplicar fix móvil del clúster
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Renovar versión de recursos del clúster
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('video-project-3-1-12','video-project-3-1-13')
          p.write_text(s)
          PY
      - name: Validar referencias
        run: |
          grep -q 'cluster-image.js?v=video-project-3-1-13' index.html
          grep -q 'cluster-video-project-3-1-mobile.mp4?v=video-project-3-1-13' index.html
      - name: Publicar fix y retirar workflow temporal
        run: |
          rm -f .github/workflows/bump-mobile-video-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/bump-mobile-video-fix.yml
          git commit -m 'Activa reproducción móvil robusta del clúster'
          git push