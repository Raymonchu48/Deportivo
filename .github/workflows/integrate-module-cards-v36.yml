name: Integrate module cards v36
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-module-cards-v36.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar cinco módulos HUD
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          # Cargar el nuevo CSS después del responsive existente, para que sea el override final.
          link = '<link rel="stylesheet" href="module-cards-v36.css?v=36">'
          if link not in html:
              marker = '<link rel="stylesheet" href="mobile-cluster-fix.css?v=35">'
              if marker not in html:
                  raise SystemExit('No se encontró el enlace mobile-cluster-fix v35')
              html = html.replace(marker, marker + '\n' + link, 1)

          # Eliminar Adaptado como tarjeta independiente.
          html, n = re.subn(
              r'\n<button type="button" data-open="adapted" aria-controls="ic-screen" aria-expanded="false"><span class="ic-num">05</span><strong>Adaptado</strong></button>',
              '', html, count=1
          )
          if n != 1:
              raise SystemExit('No se pudo retirar la tarjeta Adaptado')

          # Gestión pasa a ser el quinto módulo visible.
          old = '<button type="button" data-open="management" aria-controls="ic-screen" aria-expanded="false"><span class="ic-num">06</span><strong>Gestión</strong></button>'
          new = '<button type="button" data-open="management" aria-controls="ic-screen" aria-expanded="false"><span class="ic-num">05</span><strong>Gestión</strong></button>'
          if old not in html:
              raise SystemExit('No se encontró Gestión 06')
          html = html.replace(old, new, 1)
          index.write_text(html, encoding='utf-8')

          js_path = Path('cluster-image.js')
          js = js_path.read_text(encoding='utf-8')

          old_cues = "var cueTimes={training:.30,adapted:2.80,management:3.85,recovery:7.45,mind:9.95,nutrition:11.00};"
          new_cues = "var cueTimes={training:.30,management:3.85,recovery:7.45,mind:9.95,nutrition:11.00};"
          if old_cues not in js:
              raise SystemExit('No se encontró cueTimes esperado')
          js = js.replace(old_cues, new_cues, 1)

          old_reflect = "var t=motionVideo.currentTime;var key=t>=10.80?'nutrition':t>=9.95?'mind':t>=7.25?'recovery':t>=3.55?'management':t>=2.80?'adapted':'training';"
          new_reflect = "var t=motionVideo.currentTime;var key=t>=10.80?'nutrition':t>=9.95?'mind':t>=7.25?'recovery':t>=3.55?'management':'training';"
          if old_reflect not in js:
              raise SystemExit('No se encontró reflectVideoCue esperado')
          js = js.replace(old_reflect, new_reflect, 1)

          old_training = "training:{title:'Entrenamiento',copy:'Planificación, fuerza, técnica, progresión y control de carga dentro de una visión integral.',sources:[['metodo','.method-grid'],['formacion','.cert:nth-child(1),.cert:nth-child(2)']]},"
          new_training = "training:{title:'Entrenamiento',copy:'Planificación, fuerza, técnica, progresión, control de carga y adaptación del ejercicio a capacidades y necesidades individuales.',sources:[['metodo','.method-grid'],['formacion','.cert:nth-child(1),.cert:nth-child(2)'],['experiencia','.exp:nth-child(3)'],['formacion','.cert:nth-child(9)']]},"
          if old_training not in js:
              raise SystemExit('No se encontró el módulo Entrenamiento esperado')
          js = js.replace(old_training, new_training, 1)

          marker = "content.appendChild(cards);\n}else if(doc){"
          replacement = "content.appendChild(cards);\nif(key==='training'){var adaptedBlock=document.createElement('article');adaptedBlock.className='ic-adapted-in-training';adaptedBlock.innerHTML='<h3>Entrenamiento adaptado</h3><p>Progresión ajustada a capacidades, autonomía, movilidad, contexto y necesidades individuales, incluyendo experiencia con tercera edad y colectivos especiales.</p>';content.appendChild(adaptedBlock);}\n}else if(doc){"
          if marker not in js:
              raise SystemExit('No se encontró punto de inserción para entrenamiento adaptado')
          js = js.replace(marker, replacement, 1)
          js_path.write_text(js, encoding='utf-8')
          PY

      - name: Validar estructura
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'module-cards-v36.css?v=36' index.html
          ! grep -q 'data-open="adapted" aria-controls="ic-screen"' index.html
          grep -q 'data-open="management".*ic-num">05' index.html
          grep -q 'Entrenamiento adaptado' cluster-image.js
          grep -q "var cueTimes={training:.30,management:3.85" cluster-image.js

      - name: Publicar y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html cluster-image.js module-cards-v36.css
          git rm .github/workflows/integrate-module-cards-v36.yml
          git commit -m 'Integra módulos como tarjetas HUD reales'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
