<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Deportivo · Ramón Alberto Curbalán Vega</title>
  <style>
    html,body{margin:0;min-height:100%;background:#eef3ff;font-family:Arial,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;color:#2c3472;font-weight:800;letter-spacing:.05em}
  </style>
</head>
<body>
  <div class="loading">Cargando portfolio…</div>
  <script>
    fetch('portfolio-base.html?v=3')
      .then(function(r){ if(!r.ok) throw new Error('No se pudo cargar el portfolio'); return r.text(); })
      .then(function(html){
        html = html.replace('</head>', '<link rel="stylesheet" href="sporty-overrides.css?v=3"></head>');
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(){ document.body.innerHTML='<div class="loading">No se pudo cargar el portfolio. Recarga la página.</div>'; });
  </script>
</body>
</html>
