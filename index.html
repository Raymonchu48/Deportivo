<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Deportivo · Ramón Alberto Curbalán Vega</title>
  <style>
    html,body{margin:0;min-height:100%;background:#eef3ff;font-family:Arial,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;color:#2c3472;font-weight:800;letter-spacing:.05em}
  </style>
</head>
<body>
  <div class="loading">Cargando portfolio…</div>
  <script>
    fetch('portfolio-base.html?v=11')
      .then(function(r){if(!r.ok)throw new Error('No se pudo cargar el portfolio');return r.text();})
      .then(function(html){
        var interactionCss=`
          [hidden]{display:none!important}
          .section-view{animation:sectionIn .32s ease both}
          @keyframes sectionIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
          .menu a.is-active{color:var(--pink)!important;opacity:1!important}
          .section-back{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:20px 0 8px;padding:10px 16px;border:1px solid rgba(44,52,114,.14);border-radius:999px;background:#fff;color:var(--navy);font-weight:850;cursor:pointer;box-shadow:0 10px 24px rgba(18,23,61,.08)}
          @media(max-width:920px){.nav{flex-wrap:wrap!important;gap:10px!important}.menu{display:flex!important;order:3;width:100%;gap:8px!important;flex-wrap:nowrap!important;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 2px;scrollbar-width:none}.menu::-webkit-scrollbar{display:none}.menu a{flex:0 0 auto;padding:7px 11px;border-radius:999px;background:rgba(44,52,114,.06);font-size:.78rem;white-space:nowrap}body.sport-system-home .menu a{background:rgba(255,255,255,.045)}}
          @media(max-width:640px){.topbar{position:sticky;top:0}.nav{padding:10px 12px!important}.brand{width:auto}.menu{margin-top:2px}.section-back{margin-left:2px}}
        `;
        html=html.replace('</head>','<link rel="stylesheet" href="sporty-overrides.css?v=11"><link rel="stylesheet" href="sport-fusion.css?v=6"><link rel="stylesheet" href="sport-hero-v2.css?v=4"><link rel="stylesheet" href="sport-title-fix.css?v=1"><link rel="stylesheet" href="sport-desktop-expand.css?v=2"><link rel="stylesheet" href="sport-module-theme.css?v=1"><link rel="stylesheet" href="sport-immersive-hero.css?v=1"><link rel="stylesheet" href="sport-hero-balance.css?v=1"><link rel="stylesheet" href="sport-module-topright.css?v=1"><link rel="stylesheet" href="sport-unified-responsive.css?v=1"><style>'+interactionCss+'</style></head>');

        var interactionJs=`
          (function(){
            var main=document.querySelector('main#inicio');if(!main)return;
            var homeHero=main.querySelector('.hero-wrap'),homeStats=main.querySelector('.stats'),transition=main.querySelector('.transition-banner'),footer=main.querySelector('footer');
            var ids=['cluster','sobre-mi','metodo','formacion','proyectos','experiencia','contacto'];
            var panels=ids.map(function(id){return document.getElementById(id)}).filter(Boolean);
            var menuLinks=Array.from(document.querySelectorAll('.menu a[href^="#"]'));var brand=document.querySelector('.brand[href="#inicio"]');
            function setActive(id){menuLinks.forEach(function(a){a.classList.toggle('is-active',a.getAttribute('href')==='#'+id)});}
            function hideEverything(){if(homeHero)homeHero.hidden=true;if(homeStats)homeStats.hidden=true;panels.forEach(function(p){p.hidden=true;p.classList.remove('section-view')});if(transition)transition.hidden=true;if(footer)footer.hidden=true;}
            function ensureBackButton(section){var existing=section.querySelector('.section-back');if(existing){existing.hidden=false;return}var b=document.createElement('button');b.type='button';b.className='section-back';b.textContent='← Volver al núcleo';b.addEventListener('click',function(){history.pushState(null,'','#inicio');showHome(true)});section.prepend(b);}
            function revealCluster(){var cluster=document.getElementById('cluster');if(cluster){cluster.hidden=false;cluster.classList.add('section-view');var back=cluster.querySelector('.section-back');if(back)back.hidden=true;}}
            function showHome(shouldScroll){hideEverything();document.body.classList.add('sport-system-home');if(window.SP_CLOSE_MODULE)window.SP_CLOSE_MODULE();revealCluster();setActive('cluster');if(shouldScroll!==false)window.scrollTo({top:0,behavior:'smooth'});}
            function showIntegrated(id,shouldScroll){hideEverything();document.body.classList.add('sport-system-home');revealCluster();setActive(id);if(window.SP_OPEN_MODULE)window.SP_OPEN_MODULE(id);if(shouldScroll!==false)window.scrollTo({top:0,behavior:'smooth'});}
            function showLegacy(id,shouldScroll){var target=document.getElementById(id);if(!target){showHome(shouldScroll);return}hideEverything();document.body.classList.remove('sport-system-home','sp-hud-off','fit-hud-off');target.hidden=false;target.classList.add('section-view');ensureBackButton(target);if(id==='formacion'&&transition)transition.hidden=false;setActive(id);if(shouldScroll!==false){var top=Math.max(0,target.getBoundingClientRect().top+window.scrollY-92);window.scrollTo({top:top,behavior:'smooth'});}}
            menuLinks.forEach(function(a){a.addEventListener('click',function(e){var id=(a.getAttribute('href')||'').slice(1);if(!ids.includes(id))return;e.preventDefault();if(id==='cluster'){history.pushState(null,'','#inicio');showHome(true);return}history.pushState(null,'','#'+id);if(window.SP_OPEN_MODULE)showIntegrated(id,true);else showLegacy(id,true);});});
            if(brand)brand.addEventListener('click',function(e){e.preventDefault();history.pushState(null,'','#inicio');showHome(true);});
            window.addEventListener('popstate',function(){var id=location.hash.replace('#','');if(ids.includes(id)&&id!=='cluster'){if(window.SP_OPEN_MODULE)showIntegrated(id,true);else showLegacy(id,true);}else showHome(true);});
            var initial=location.hash.replace('#','');if(ids.includes(initial)&&initial!=='cluster'){if(window.SP_OPEN_MODULE)showIntegrated(initial,false);else showLegacy(initial,false);}else showHome(false);
          })();
        `;
        html=html.replace('</body>','<script src="sport-fusion.js?v=6"><\/script><script src="sport-hero-v2.js?v=4"><\/script><script src="sport-title-fix.js?v=2"><\/script><script src="sport-video-profile.js?v=3"><\/script><script>'+interactionJs+'<\/script></body>');
        document.open();document.write(html);document.close();
      })
      .catch(function(){document.body.innerHTML='<div class="loading">No se pudo cargar el portfolio. Recarga la página.</div>';});
  </script>
</body>
</html>
