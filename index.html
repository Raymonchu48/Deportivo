<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07120d">
  <meta name="description" content="Portfolio deportivo interactivo de Ramón Alberto Curbalán Vega: entrenamiento, nutrición, rendimiento y hábitos.">
  <meta property="og:title" content="Ramón Alberto Curbalán Vega · Perfil Profesional Deportivo">
  <meta property="og:description" content="Entrenamiento, nutrición, rendimiento y hábitos con un método profesional e integral.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="cluster-profesional-interactivo.webp">
  <title>Ramón Alberto Curbalán Vega · Portfolio deportivo</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307130e'/%3E%3Cpath d='M15 48 27 16h11c11 0 15 6 12 15-2 6-7 9-13 10l9 7H34L24 36l-4 12zm15-23-3 8h8c3 0 5-1 6-4 1-3-1-4-4-4z' fill='%2376b852'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#07110d;--panel:rgba(5,18,12,.9);--green:#5d9b49;--lime:#a1d66d;--line:rgba(176,224,157,.48);--text:#f4f7f4;--muted:#b9c8be}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#030705;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow:hidden}
    button{font:inherit}
    .app{min-height:100dvh;background:#020604}
    .stage{position:relative;width:100vw;height:100dvh;display:grid;place-items:center;overflow:hidden}
    .cluster{position:relative;width:100vw;height:100dvh;display:grid;place-items:center;overflow:hidden;background:#07110c;isolation:isolate}
    .cluster::before{content:"";position:absolute;inset:-42px;background:url("cluster-profesional-interactivo.webp") center/cover no-repeat;filter:blur(30px) saturate(.78);transform:scale(1.08);opacity:.5;z-index:-2}
    .cluster::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(1,8,4,.62),rgba(5,17,10,.2) 33%,rgba(5,17,10,.2) 67%,rgba(1,8,4,.62));pointer-events:none;z-index:-1}
    .artboard{position:relative;width:min(100vw,70.6dvh);aspect-ratio:1054/1493;max-height:100dvh;overflow:hidden;background:#e9eeeb;box-shadow:0 0 70px rgba(0,0,0,.68),0 0 0 1px rgba(177,220,160,.34);z-index:1}
    .artboard>img{width:100%;height:100%;object-fit:contain;display:block}
    .artboard::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 -90px 100px rgba(0,15,8,.16)}
    .hotspot{position:absolute;border:1px solid transparent;background:transparent;border-radius:12px;cursor:pointer;z-index:3;color:white;transition:.22s ease;outline:none}
    .hotspot::before{content:"";position:absolute;inset:-2px;border-radius:inherit;border:1px solid rgba(148,220,114,0);background:linear-gradient(130deg,rgba(145,220,109,.06),transparent 60%);transition:.22s ease}
    .hotspot::after{content:attr(data-label);position:absolute;left:10px;top:9px;padding:7px 10px;border-radius:999px;background:rgba(4,20,11,.88);border:1px solid rgba(159,224,128,.7);box-shadow:0 5px 22px rgba(0,0,0,.35);font-size:clamp(10px,1.25vh,13px);font-weight:800;letter-spacing:.045em;text-transform:uppercase;opacity:0;transform:translateY(4px);transition:.2s ease;white-space:nowrap}
    .hotspot:hover,.hotspot:focus-visible{background:rgba(83,155,58,.10);box-shadow:0 0 0 2px rgba(154,226,119,.72),0 0 26px rgba(99,187,65,.42)}
    .hotspot:hover::before,.hotspot:focus-visible::before{border-color:rgba(154,226,119,.55)}.hotspot:hover::after,.hotspot:focus-visible::after{opacity:1;transform:none}
    .hotspot.active{background:rgba(73,148,48,.13);box-shadow:0 0 0 2px #9bdb77,0 0 30px rgba(111,206,75,.5)}
    .identity{left:1.4%;top:10.6%;width:35.4%;height:11.1%}.method{left:67%;top:10.6%;width:32.3%;height:11.3%}.experience{left:1.3%;top:22.4%;width:35.5%;height:13.9%}.skills{left:68%;top:25.7%;width:31.3%;height:15.9%}.specialties{left:1.3%;top:46%;width:35.6%;height:17.7%}.value{left:68.1%;top:42.3%;width:31%;height:14.3%}.impact{left:68.2%;top:57.4%;width:31%;height:17.6%}.profile{left:22.5%;top:92.7%;width:51.4%;height:3.45%;border-radius:8px}.profile::after{left:10px;top:auto;bottom:calc(100% + 7px);transform:translateY(4px)}.profile:hover::after,.profile:focus-visible::after{transform:none}
    .drawer{position:absolute;z-index:12;right:2.1%;top:2%;bottom:2%;width:min(43%,390px);padding:clamp(18px,2.4vw,28px);border:1px solid rgba(167,226,140,.65);border-radius:18px;background:linear-gradient(155deg,rgba(5,21,13,.97),rgba(8,31,19,.93));box-shadow:-18px 0 55px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.1);backdrop-filter:blur(18px);transform:translateX(calc(100% + 28px));opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.8,.2,1);overflow:auto}
    .drawer.open{transform:none;opacity:1;pointer-events:auto}.close{position:absolute;right:14px;top:14px;width:36px;height:36px;border:1px solid rgba(179,224,159,.42);border-radius:50%;background:rgba(255,255,255,.06);color:white;cursor:pointer;font-size:1.25rem}.eyebrow{color:#a9db8d;text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;font-weight:800;margin:20px 0 10px}.drawer h2{font-size:clamp(1.45rem,2.5vw,2.2rem);line-height:1.05;margin:0 46px 10px 0}.drawer p{color:#d4ded7;line-height:1.55;margin:0 0 18px}.detail-list{display:grid;gap:9px;margin-top:18px}.detail{padding:13px 14px;border-radius:12px;border:1px solid rgba(179,224,159,.18);background:rgba(255,255,255,.055);display:flex;gap:11px;align-items:flex-start}.detail i{font-style:normal;color:#9ddc7b;font-weight:900}.detail span{font-size:.88rem;line-height:1.35}.drawer-actions{display:grid;gap:9px;margin-top:20px}.drawer-action{width:100%;padding:13px 15px;border:1px solid #9cda78;border-radius:11px;background:linear-gradient(135deg,#477c37,#6da951);color:#fff;font-weight:800;text-align:center;cursor:pointer}.drawer-action.secondary{background:rgba(255,255,255,.055);border-color:rgba(179,224,159,.36)}.drawer-action:hover{filter:brightness(1.12)}
    .veil{position:absolute;inset:0;z-index:10;background:rgba(0,9,4,.38);opacity:0;pointer-events:none;transition:.25s}.veil.on{opacity:1;pointer-events:auto}
    .mobile-dock{display:none}
    @media(max-width:780px){
      body{overflow:hidden}.app,.stage,.cluster{height:100dvh;min-height:100dvh}.artboard{width:min(100vw,70.6dvh);max-height:100dvh}.cluster::before{inset:-24px;filter:blur(22px) saturate(.8);opacity:.62}.cluster::after{background:linear-gradient(180deg,rgba(1,8,4,.38),rgba(3,11,7,.05) 28%,rgba(3,11,7,.05) 72%,rgba(1,8,4,.55))}.hotspot::after{display:none}
      .hotspot{display:none}.profile{display:block;left:22.5%;top:92.7%;width:51.4%;height:3.45%;border-radius:6px}
      .drawer{position:fixed;left:10px;right:10px;top:auto;bottom:78px;width:auto;max-height:68dvh;transform:translateY(calc(100% + 90px));border-radius:18px}.drawer.open{transform:none}.veil{position:fixed}
      .mobile-dock{position:fixed;z-index:16;left:8px;right:8px;bottom:8px;height:60px;display:flex;gap:7px;padding:7px;overflow-x:auto;border:1px solid rgba(165,219,140,.35);border-radius:16px;background:rgba(3,14,8,.94);backdrop-filter:blur(18px);scrollbar-width:none}.mobile-dock::-webkit-scrollbar{display:none}.mobile-dock button{flex:0 0 auto;border:1px solid rgba(165,219,140,.26);border-radius:10px;background:rgba(255,255,255,.06);color:#edf5ee;padding:0 14px;font-size:.78rem;font-weight:750;cursor:pointer}.mobile-dock button.active{background:#4f873c;border-color:#9fdc7b}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <section class="stage" aria-label="Clúster deportivo interactivo">
      <div class="cluster" id="cluster">
        <div class="artboard">
        <img src="cluster-profesional-interactivo.webp" alt="Infografía del perfil profesional deportivo de Ramón Alberto Curbalán Vega" width="1054" height="1493">
        <button class="hotspot identity" data-panel="identity" data-label="Abrir identidad" aria-label="Abrir identidad profesional"></button>
        <button class="hotspot method" data-panel="method" data-label="Abrir metodología" aria-label="Abrir metodología"></button>
        <button class="hotspot experience" data-panel="experience" data-label="Abrir experiencia" aria-label="Abrir experiencia"></button>
        <button class="hotspot skills" data-panel="skills" data-label="Abrir competencias" aria-label="Abrir competencias clave"></button>
        <button class="hotspot specialties" data-panel="specialties" data-label="Abrir especialidades" aria-label="Abrir especialidades"></button>
        <button class="hotspot value" data-panel="value" data-label="Abrir propuesta" aria-label="Abrir propuesta de valor"></button>
        <button class="hotspot impact" data-panel="impact" data-label="Abrir impacto" aria-label="Abrir áreas de impacto"></button>
        <button class="hotspot profile" data-panel="profile" data-label="Ver perfil" aria-label="Abrir perfil profesional"></button>
        <div class="veil" id="veil"></div>
        <aside class="drawer" id="drawer" aria-live="polite" aria-hidden="true">
          <button class="close" id="close" aria-label="Cerrar panel">×</button>
          <div class="eyebrow" id="eyebrow">Perfil profesional</div>
          <h2 id="panelTitle">Ramón Alberto Curbalán Vega</h2>
          <p id="panelIntro">Entrenamiento, nutrición y hábitos conectados en un método práctico, humano y medible.</p>
          <div class="detail-list" id="panelDetails"></div>
          <div class="drawer-actions" id="panelActions"></div>
        </aside>
        </div>
      </div>
    </section>
    <nav class="mobile-dock" aria-label="Módulos del clúster">
      <button data-panel="profile">Perfil</button><button data-panel="identity">Identidad</button><button data-panel="experience">Experiencia</button><button data-panel="method">Método</button><button data-panel="skills">Competencias</button><button data-panel="specialties">Especialidades</button><button data-panel="value">Propuesta</button><button data-panel="impact">Impacto</button>
    </nav>
  </main>
  <script>
    const panels={
      profile:{tag:'Perfil profesional',title:'Ramón Alberto Curbalán Vega',intro:'Una visión 360º del rendimiento: entrenamiento, nutrición y hábitos con acompañamiento real.',items:['Coach y entrenador orientado a resultados','Planificación personalizada y seguimiento','Trabajo humano, técnico y sostenible'],actions:[['Descargar CV','CV_Deporte.pdf'],['Cartas de recomendación','Cartas_Recomendacion.pdf'],['Contacto profesional','mailto:ramonalberto.curbalvega@gmail.com']]},
      identity:{tag:'Identidad profesional',title:'Más que entrenamiento',intro:'Un perfil multidisciplinar para acompañar a cada persona desde su punto de partida.',items:['Entrenador personal','Técnico nutricionista','Coach de rendimiento','Técnico en salas polivalentes'],actions:[['Carta de presentación','Carta_presentacion_deportiva_profesional.pdf'],['Perfil de LinkedIn','https://www.linkedin.com/in/ramon-alberto-vega-976084417']]},
      experience:{tag:'Experiencia',title:'+23 años activando resultados',intro:'Experiencia práctica con perfiles y objetivos muy distintos, desde la mejora física hasta la adherencia a largo plazo.',items:['Trabajo individual y grupal','Adultos y tercera edad','Salud, forma física y adherencia','Dirección de programas deportivos'],actions:[['Ver CV profesional','CV_Deporte.pdf']]},
      method:{tag:'Metodología',title:'Medir. Planificar. Evolucionar.',intro:'Cada proceso parte de una valoración clara y se ajusta con datos, criterio profesional y escucha activa.',items:['01 — Valoración inicial','02 — Plan personalizado','03 — Seguimiento medible','04 — Ajustes y evolución'],actions:[['Conocer mi enfoque','Carta_presentacion_deportiva_profesional.pdf']]},
      skills:{tag:'Competencias clave',title:'Liderazgo que mueve personas',intro:'La técnica importa; la capacidad de conectar, comunicar y sostener la motivación marca la diferencia.',items:['Motivación y disciplina','Empatía y comunicación','Liderazgo de grupos','Atención al detalle'],actions:[['Coaching y psicología deportiva','Master_coaching_ Psicologia_deportiva.pdf']]},
      specialties:{tag:'Especialidades',title:'Entrenamiento adaptado a cada contexto',intro:'Una oferta amplia conectada por el mismo criterio: seguridad, progresión y transferencia a la vida real.',items:['Entrenamiento funcional y fuerza','Pilates, movilidad y core','Cycling y natación','Nutrición deportiva'],actions:[['Acondicionamiento físico','copia_FP_deporte.pdf'],['Musculación y fitness','Monitor_ Musculacion_Fitnnes.pdf'],['Nutrición deportiva','Master_Nutrición.pdf'],['Gestión deportiva','Gestion_Entidades_deportivas.pdf']]},
      value:{tag:'Propuesta de valor',title:'Método integral, decisiones concretas',intro:'El programa une entrenamiento, nutrición y hábitos sin convertir el proceso en una colección de tareas imposibles.',items:['Visión 360º','Mejora medible del rendimiento','Programas adaptados al contexto personal'],actions:[['Ver propuesta profesional','Carta_presentacion_deportiva_profesional.pdf']]},
      impact:{tag:'Áreas de impacto',title:'Resultados que se sienten y se sostienen',intro:'El objetivo no es solo entrenar más, sino vivir y rendir mejor con una base física sólida.',items:['Pérdida de grasa y tonificación','Salud postural y movilidad','Bienestar y rendimiento','Longevidad activa'],actions:[['Contactar','mailto:ramonalberto.curbalvega@gmail.com']]}
    };
    const drawer=document.getElementById('drawer'),veil=document.getElementById('veil'),close=document.getElementById('close');
    const allButtons=[...document.querySelectorAll('[data-panel]')];
    function openPanel(key){const p=panels[key];if(!p)return;document.getElementById('eyebrow').textContent=p.tag;document.getElementById('panelTitle').textContent=p.title;document.getElementById('panelIntro').textContent=p.intro;document.getElementById('panelDetails').innerHTML=p.items.map(x=>`<div class="detail"><i>→</i><span>${x}</span></div>`).join('');document.getElementById('panelActions').innerHTML=p.actions.map((a,i)=>`<a class="drawer-action${i?' secondary':''}" href="${a[1]}"${a[1].startsWith('http')||a[1].endsWith('.pdf')?' target="_blank" rel="noopener"':''}>${a[0]}</a>`).join('');allButtons.forEach(b=>b.classList.toggle('active',b.dataset.panel===key));drawer.classList.add('open');veil.classList.add('on');drawer.setAttribute('aria-hidden','false');close.focus({preventScroll:true})}
    function closePanel(){drawer.classList.remove('open');veil.classList.remove('on');drawer.setAttribute('aria-hidden','true');allButtons.forEach(b=>b.classList.remove('active'))}
    allButtons.forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.panel)));close.addEventListener('click',closePanel);veil.addEventListener('click',closePanel);document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
  </script>
</body>
</html>
