<script>
const PANELS={profile:{tag:'Perfil profesional',title:'Ramón Alberto Curbalán Vega',intro:'Una visión 360º del rendimiento: entrenamiento, nutrición y hábitos con acompañamiento real.',items:['Coach y entrenador orientado a resultados','Planificación personalizada y seguimiento','Trabajo humano, técnico y sostenible'],actions:[['Descargar CV','CV_Deporte.pdf'],['Cartas de recomendación','Cartas_Recomendacion.pdf'],['Contacto profesional','mailto:ramonalberto.curbalvega@gmail.com']]},method:{tag:'Metodología',title:'Medir. Planificar. Evolucionar.',intro:'Cada proceso parte de una valoración clara y se ajusta con datos, criterio profesional y escucha activa.',items:['01 — Valoración inicial','02 — Plan personalizado','03 — Seguimiento medible','04 — Ajustes y evolución'],actions:[['Conocer mi enfoque','Carta_presentacion_deportiva_profesional.pdf']]},experience:{tag:'Experiencia',title:'+23 años activando resultados',intro:'Experiencia práctica con perfiles y objetivos muy distintos, desde la mejora física hasta la adherencia a largo plazo.',items:['Trabajo individual y grupal','Adultos y tercera edad','Salud, forma física y adherencia','Dirección de programas deportivos'],actions:[['Ver CV profesional','CV_Deporte.pdf']]},specialties:{tag:'Especialidades',title:'Entrenamiento adaptado a cada contexto',intro:'Una oferta amplia conectada por el mismo criterio: seguridad, progresión y transferencia a la vida real.',items:['Entrenamiento funcional y fuerza','Pilates, movilidad y core','Cycling y natación','Nutrición deportiva'],actions:[['Acondicionamiento físico','copia_FP_deporte.pdf'],['Musculación y fitness','Monitor_ Musculacion_Fitnnes.pdf'],['Nutrición deportiva','Master_Nutrición.pdf']]},value:{tag:'Hablemos',title:'Un nuevo reto empieza con una conversación',intro:'Cuéntame tu objetivo, contexto y punto de partida. A partir de ahí definimos un proceso realista y medible.',items:['Valoración inicial','Objetivos claros','Plan adaptado','Seguimiento profesional'], const drawer=document.getElementById('drawer'),drawerClose=document.getElementById('drawerClose'),tag=document.getElementById('drawerTag'),title=document.getElementById('drawerTitle'),intro=document.getElementById('drawerIntro'),list=document.getElementById('drawerList'),actions=document.getElementById('drawerActions');const allPanelButtons=[...document.querySelectorAll('[data-panel]')];function openPanel(key){const p=PANELS[key];if(!p)return;tag.textContent=p.tag;title.textContent=p.title;intro.textContent=p.intro;list.innerHTML=p.items.map(x=>`<li>${x}</li>`).join('');actions.innerHTML=p.actions.map(a=>`<a href="${a[1]}" target="_blank" rel="noopener">${a[0]}</a>`).join('');allPanelButtons.forEach(b=>b.classList.toggle('active',b.dataset.panel===key));drawer.classList.add('open');drawer.setAttribute('aria-hidden','false')}function closeDrawer(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');allPanelButtons.forEach(b=>b.classList.remove('active'))}allPanelButtons.forEach(b=>b.addEventListener('click',()=>openPanel(b.dataset.panel)));drawerClose.addEventListener('click',closeDrawer);document.querySelector('[data-link="CV_Deporte.pdf"]').addEventListener('click',()=>window.open('CV_Deporte.pdf','_blank','noopener'));const modal=document.getElementById('videoModal'),detail=document.getElementById('detailVideo'),videoLabel=document.getElementById('videoLabel'),videoClose=document.getElementById('videoClose');const VIDEOS={strength:{label:'Entrenamiento funcional · Cuerdas',src:'gym-zone-20260916.mp4'},swim:{label:'Natación · Técnica y eficiencia',src:'swimmer-zone-20260916.mp4'},profile:{label:'Presentación profesional',src:'video-perfil-deportivo-corregido.mp4?v=20260913-iphone'}};function openVideo(key){const v=VIDEOS[key];if(!v)return;closeDrawer();videoLabel.textContent=v.label;detail.src=v.src;modal.classList.add('open');modal.setAttribute('aria-hidden','false');detail.play().catch(()=>{})}function closeVideo(){detail.pause();modal.classList.remove('open');modal.setAttribute('aria-hidden','true');detail.removeAttribute('src');detail.load()}document.querySelectorAll('[data-video]').forEach(b=>b.addEventListener('click',()=>openVideo(b.dataset.video)));videoClose.addEventListener('click',closeVideo);modal.addEventListener('click',e=>{if(e.target===modal)closeVideo()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeVideo()}});const master=document.getElementById('master');const syncMaster=()=>{if(document.hidden||modal.classList.contains('open'))master.pause();else master.play().catch(()=>{})};document.addEventListener('visibilitychange',syncMaster);modal.addEventListener('transitionend',syncMaster);const seq=[...document.querySelectorAll('.nav-hot')];let i=0,hovering=false;function step(){if(hovering||drawer.classList.contains('open')||modal.classList.contains('open'))return;seq.forEach(x=>x.classList.remove('active'));seq[i%seq.length].classList.add('active');i++}setInterval(step,1450);step();seq.forEach(b=>{b.addEventListener('pointerenter',()=>{hovering=true;seq.forEach(x=>x.classList.remove('active'));b.classList.add('active')});b.addEventListener('pointerleave',()=>{hovering=false;b.classList.remove('active')})});
